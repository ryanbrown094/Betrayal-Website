name: iOS native app

# Builds the native iPhone app (ios/) on one of GitHub's Macs, checks its model against a game recorded from the real
# rules engine, and runs it in the simulator: recorded moments (-demo), every moment drawn offscreen (-render-all), and
# a game against bots on a local Worker, the app playing the host. The pictures go to the run's "ios-native-screens"
# artifact, and as one commit to refs/screens/ios-native (not a branch, so nothing deploys it), for a session that can
# reach git but not the artifact store:  git fetch origin refs/screens/ios-native
# Mac minutes count ten times against the account's Actions allowance, so it runs only when ios/ changes, or by hand.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Play the whole game against bots, not just the first round (about four minutes more)"
        type: boolean
        default: false

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # the pictures' ref (the last step)
    env:
      APP: uk.co.thebetrayal.app
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: The model reads every recorded moment
        run: |
          swiftc ios/TheBetrayal/Model/JSON.swift ios/TheBetrayal/Model/Snapshot.swift ios/TheBetrayal/Model/Logic.swift ios/TheBetrayal/UI/Art.swift ios/ci/main.swift -o decode
          ./decode ios/TheBetrayal/Debug/Fixtures.json

      - name: Build (Debug)
        run: >
          xcodebuild -quiet -project ios/TheBetrayal.xcodeproj -scheme TheBetrayal -configuration Debug
          -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Boot the simulator
        run: |
          set -eo pipefail
          # the newest iOS runtime's first iPhone
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if ".iOS-" in k), key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")])
          print(next(x["udid"] for k in reversed(ios) for x in d[k] if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TheBetrayal.app
          mkdir -p shots/render

      - name: Recorded moments in the simulator
        run: |
          shot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$APP" "$@" > /dev/null
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null
          }
          shot 00-home 6
          shot 01-art 4 -art
          for d in lobby-host oath roles-veil roles-forsworn day-host trial-intro-forsworn quiz-open quiz-reveal-host trial-done-winner \
                   word-open change-open snap-open truths-prep-teller talk-crown vote-mine reveal-words night-forsworn-picked \
                   dawn-revealed trust end-host day-host-tools; do
            shot "demo-$d" 3 -demo "$d"
          done

      - name: Every moment, drawn offscreen
        run: |
          xcrun simctl terminate "$UDID" "$APP" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$APP" -render-all > /dev/null
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP" data)
          for i in $(seq 1 150); do [ -f "$DATA/Documents/shots/done" ] && break; sleep 2; done
          ls "$DATA/Documents/shots" | wc -l
          for f in "$DATA"/Documents/shots/*.png; do sips -s format jpeg -s formatOptions 70 "$f" --out "shots/render/$(basename "${f%.png}").jpg" > /dev/null; done

      - name: A game against bots on a local Worker
        run: |
          npm ci --no-audit --no-fund > /dev/null
          CI=true WRANGLER_SEND_METRICS=false npx wrangler dev --port 8790 --ip 127.0.0.1 --var ADMIN_TOKEN:dev --var MASTER_PASS:MASTERTEST --var SITE_PASSWORD: > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8790/ && break; sleep 2; done
          python3 ios/ci/drive.py http://127.0.0.1:8790 MASTERTEST --rounds ${{ inputs.full && '0' || '1' }} \
            --launch "xcrun simctl terminate $UDID $APP 2>/dev/null; xcrun simctl launch $UDID $APP -server http://127.0.0.1:8790 -play {room} {tok} > /dev/null" \
            --shot "xcrun simctl io $UDID screenshot shots/{name}.png > /dev/null"

      - name: Build (Release)
        run: >
          xcodebuild -quiet -project ios/TheBetrayal.xcodeproj -scheme TheBetrayal -configuration Release
          -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-screens
          path: shots/

      - name: The pictures as a git ref
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cp wrangler.log shots/ 2>/dev/null || true
          cd shots && git init -q && git add -A
          git -c user.name="iOS CI" -c user.email="ci@users.noreply.github.com" commit -qm "iOS native screens for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screens/ios-native
          echo "refs/screens/ios-native → $(git rev-parse HEAD)"
