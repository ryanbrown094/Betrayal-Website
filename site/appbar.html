<!-- The App Store banner, only for a visit that came looking for an app: an advert's keyword (utm_term, from the Final
     URL suffix) or campaign naming an app, the iPhone or the App Store, a link from the App Store itself, a link with
     ?app, or a first page about the app. On an iPhone or iPad only, never on the pages that sell or run a Table, and
     gone for the tab once closed. Everyone else is shown the website's own Tables. (sessionStorage bt-app, bt-app-hide;
     listed on /cookies) -->
<style>
.appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--plum); border-bottom: 1px solid rgba(230,165,140,.25); color: var(--ivory); font: 15px/1.25 var(--ui) }
.appbar img { width: 40px; height: 40px; border-radius: 9px; flex: none }
.appbar b { display: block; font-weight: 700 }
.appbar small { color: var(--ivory2); font-size: 13px }
.appbar .get { margin-left: auto; flex: none; padding: 7px 16px; border-radius: 999px; background: var(--rose); color: var(--ink); font-weight: 700; text-decoration: none }
.appbar .x { flex: none; background: none; border: 0; color: var(--ivory2); font-size: 24px; line-height: 1; padding: 0 2px; cursor: pointer }
</style>
<script>
(() => { try {
  const q = new URLSearchParams(location.search);
  if (q.has("app")) sessionStorage.setItem("bt-app", "1");
  if (sessionStorage.getItem("bt-app-hide") || /^\/(buy|extend|admin|survey|seal|join|t|m)(\/|$)/.test(location.pathname)) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const s = JSON.parse(sessionStorage.getItem("bt-src") || "{}");
  const want = sessionStorage.getItem("bt-app") || /\b(apps?|iphone|ipad|ios|app ?store|download)\b/i.test([s.term, s.camp, s.src].join(" ")) ||
    /(^|\.)apps\.apple\.com$/.test(s.ref || "") || s.land === "/app-privacy";
  if (!ios || !want) return;
  const bar = document.createElement("div");
  bar.className = "appbar"; bar.setAttribute("role", "region"); bar.setAttribute("aria-label", "The Betrayal app");
  bar.innerHTML = '<button class="x" type="button" aria-label="Close">×</button><img src="/icon-180.png" alt=""><div><b>The Betrayal for iPhone</b><small>Free on the App Store</small></div><a class="get" href="https://apps.apple.com/app/id6827224159">Get</a>';
  bar.querySelector(".x").onclick = () => { bar.remove(); try { sessionStorage.setItem("bt-app-hide", "1") } catch (e) {} };
  bar.querySelector(".get").onclick = () => { (window.dataLayer = window.dataLayer || []).push({ event: "app_banner_tap" }) };
  document.body.prepend(bar);
} catch (e) {} })();
</script>
