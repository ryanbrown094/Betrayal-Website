<title>__TITLE__ — Cloak &amp; Candle</title>

<style>
/*__FONTS__*/
:root { --ink: #09070a; --plum: #130d14; --ivory: #e8d0c8; --ivory2: #afa198; --rose: #e6a58c; --copper: #ae6249; --disp: "Grenze Gotisch", Georgia, serif; --book: "IM Fell DW Pica", Georgia, serif; --ui: "Alegreya Sans", system-ui, sans-serif; --sc: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif }
* { box-sizing: border-box }
html { color-scheme: dark; -webkit-text-size-adjust: 100% }
body { margin: 0; background: radial-gradient(120vw 60vh at 50% -10%, #2a1630, transparent 60%), var(--ink); color: var(--ivory); font: 18px/1.6 var(--ui) }
a { color: var(--rose) }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 20px }
nav.top { display: flex; align-items: center; gap: 12px; padding: 22px 0 8px }
nav.top a { display: flex; align-items: center; gap: 10px; color: var(--ivory); text-decoration: none; font: 600 26px/1 var(--disp) }
nav.top svg { width: 30px; height: 35px; color: var(--rose) }
.eyebrow { font: 700 13px/1 var(--sc); letter-spacing: .32em; text-transform: uppercase; color: var(--rose); margin-top: 34px }
h1 { font: 600 clamp(40px, 8vw, 64px)/1 var(--disp); margin: 10px 0 6px }
h2 { font: 600 30px/1.1 var(--disp); margin: 34px 0 8px; color: var(--ivory) }
h3 { font: 700 17px/1.3 var(--ui); margin: 20px 0 4px; color: var(--rose) }
p, li { color: var(--ivory2) } strong, b { color: var(--ivory) }
.updated { color: #877e78; font-size: 15px; margin: 0 }
.ph { background: rgba(230,165,140,.16); color: var(--rose); border-radius: 4px; padding: 0 4px; font-weight: 600 }
.note { padding: 14px 16px; border-radius: 10px; background: var(--plum); border: 1px solid rgba(230,165,140,.3); margin: 18px 0 }
table { width: 100%; border-collapse: collapse; font-size: 16px; margin: 10px 0 } th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid rgba(230,165,140,.18) } th { color: var(--ivory); font-weight: 700 } td { color: var(--ivory2) }
.table-scroll { overflow-x: auto }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 12px 26px; border-radius: 10px; border: 1px solid var(--rose); background: linear-gradient(180deg, #eaac93, #b5664b 55%, #8a4731); color: #150b17; font: 700 17px/1 var(--ui); text-decoration: none; cursor: pointer }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed }
.panel { padding: 22px; border-radius: 14px; background: var(--plum); border: 1px solid rgba(230,165,140,.35); margin: 20px 0 }
label.check { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0; color: var(--ivory2); font-size: 16.5px; cursor: pointer } label.check input { width: 22px; height: 22px; margin-top: 3px; flex: none; accent-color: var(--rose) }
.price { display: block; font: 600 44px/1.1 var(--disp); color: var(--ivory); margin: 4px 0 6px } .price em { font: 400 18px/1 var(--ui); color: var(--ivory2) }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 20px 0 } @media (max-width: 600px) { .plans { grid-template-columns: 1fr } }
.plan { display: flex; gap: 12px; padding: 18px; border-radius: 14px; background: var(--plum); border: 1px solid rgba(230,165,140,.3); cursor: pointer } .plan:has(input:checked) { border-color: var(--rose); box-shadow: 0 0 0 1px var(--rose) }
.plan input { width: 22px; height: 22px; margin-top: 4px; flex: none; accent-color: var(--rose) } .plan b { font: 700 13px/1 var(--sc); letter-spacing: .2em; text-transform: uppercase; color: var(--rose) } .plan small { display: block; color: var(--ivory2); font-size: 16px; line-height: 1.45 }
footer { margin: 60px 0 0; padding: 28px 0 44px; border-top: 1px solid rgba(230,165,140,.2); color: #877e78; font-size: 14.5px; text-align: center }
footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin-bottom: 12px } footer nav a { color: var(--ivory2) }
</style>
</head>
