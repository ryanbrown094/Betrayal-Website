# Production: thebetrayal.co.uk (formerly cloakandcandle.co.uk; the Worker keeps its old name so its Durable Objects,
# with every pass and room, carry on). Cloudflare's Git integration deploys this file with `npx wrangler deploy` from the
# repo root; ./deploy.sh does the same by hand. Staging: wrangler.staging.toml.
name = "cloak-and-candle"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
account_id = "52f36be1337501d7eb4752e3ca42fac7"

# The Betrayal lives at thebetrayal.co.uk. The old name's domain stays attached and redirects every page there.
routes = [
  { pattern = "thebetrayal.co.uk", custom_domain = true },
  { pattern = "www.thebetrayal.co.uk", custom_domain = true },
  { pattern = "cloakandcandle.co.uk", custom_domain = true },
  { pattern = "www.cloakandcandle.co.uk", custom_domain = true }
]

[vars]
SITE_HOST = "thebetrayal.co.uk"    # the one address: www. and the old domains redirect here (pages only; the API answers everywhere)
OLD_HOSTS = "cloakandcandle.co.uk,www.cloakandcandle.co.uk"
PASS_HOURS = "48"        # a redeemed party pass keeps its room writable this long
KEEP_DAYS = "7"          # then the room is read-only for this many days, then deleted
SITE_PASSWORD = "candlelight" # pre-launch gate for the whole site; delete this line to open it to the public
STRIPE_PRICE_ID = "price_1UKk9M9eT91BoTqdQ5HJ0lQa"  # the £15 party pass's Stripe Price — LIVE MODE. Empty = checkout closed
STRIPE_SUB_PRICE_ID = "price_1UKk9M9eT91BoTqd9P9iSm1I"  # the £20/month unlimited subscription's Price — LIVE MODE; empty = subscription not on sale
ADMIN_USER = "ryanab94.admin"  # the /admin page's username; its password is the ADMIN_PASSWORD secret
# Secrets (never in this file), each: npx wrangler secret put NAME -c <this file>
#   ADMIN_PASSWORD, ADMIN_TOKEN, STRIPE_SECRET_KEY (sk_test_… on staging, sk_live_… on production), STRIPE_WEBHOOK_SECRET (whsec_…), MASTER_PASS

# Previews: Cloudflare builds every non-main branch with `wrangler preview`. Nothing is inherited from above, so it is all
# spelled out here. Each preview gets its own, empty Durable Objects (no production passes or rooms), no secrets (no
# admin, no master passcode) and a closed checkout.
[previews.vars]
PASS_HOURS = "48"
KEEP_DAYS = "1"
SITE_PASSWORD = "candlelight"
STRIPE_PRICE_ID = ""
STRIPE_SUB_PRICE_ID = ""

[[previews.durable_objects.bindings]]
name = "GAME"
class_name = "GameState"

[[previews.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# Workers Logs: console output and uncaught exceptions, searchable in the Cloudflare dashboard (Workers → cloak-and-candle
# → Logs). The game's own error log is on /admin → Errors.
[observability]
enabled = true

[assets]
directory = "./worker/public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true   # every request passes the Worker first, so the password gate covers static files too

[durable_objects]
bindings = [
  { name = "GAME", class_name = "GameState" },
  { name = "REGISTRY", class_name = "Registry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameState", "Registry"]
