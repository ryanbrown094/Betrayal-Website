/* ===================== TOKENS ===================== */
@property --winA { syntax: "<color>"; inherits: true; initial-value: #24344d }
@property --winB { syntax: "<color>"; inherits: true; initial-value: #0b1220 }
@property --shaft { syntax: "<color>"; inherits: true; initial-value: rgba(143,163,184,.10) }
@property --hearth { syntax: "<color>"; inherits: true; initial-value: rgba(217,106,76,.20) }
:root {
  --soot: #09070a; --peat: #130d14; --walnut: #251428; --walnut2: #341b37;
  --tallow: #e8d0c8; --tallow2: #afa198; --mist: #877e78;
  --brass: #ae6249; --brass2: #e6a58c; --brass3: #582c5f;
  --ox: #7a1439; --blood: #c22961; --blood2: #ea5a8f;
  --steel: #8fa3b8; --verd: #5fa88f; --verd2: #2e6b57;
  --disp: "Grenze Gotisch", "Cinzel", "Times New Roman", serif;
  --book: "IM Fell DW Pica", "Cormorant Garamond", Georgia, serif;
  --ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --sc: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--soot); color: var(--tallow); -webkit-text-size-adjust: 100% }
body { font-family: var(--ui); overflow-x: hidden }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent }
svg { display: block }
.ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible }
.ico .f { fill: currentColor; stroke: none }
.num { font-variant-numeric: tabular-nums lining-nums }

/* ===================== TV: the set ===================== */
#tv { position: fixed; inset: 0; overflow: hidden; background: var(--soot); cursor: default; user-select: none;
  --winA: #2b3d59; --winB: #0b1220; --shaft: rgba(143,163,184,.12); --hearth: rgba(217,106,76,.22); --light: 1;
  transition: --winA 3s ease, --winB 3s ease, --shaft 3s ease, --hearth 3s ease }
#tv.scene-lobby { --winA: #3a4f72; --winB: #0a101c; --shaft: rgba(143,163,184,.2) }
#tv.scene-day { --winA: #c08571; --winB: #432d47; --shaft: rgba(230,165,140,.24); --hearth: rgba(217,106,76,.16) }
#tv.scene-mission { --winA: #b07361; --winB: #2e1f31; --shaft: rgba(230,165,140,.15) }
#tv.scene-mingle { --winA: #bb6551; --winB: #331a36; --shaft: rgba(217,106,76,.2) }
#tv.scene-table { --winA: #22314f; --winB: #06090f; --shaft: rgba(143,163,184,.11); --hearth: rgba(217,94,66,.30) }
#tv.scene-morning { --winA: #d2b099; --winB: #5a3442; --shaft: rgba(218,184,162,.28) }
#tv.scene-final { --winA: #3a2230; --winB: #0d0609; --shaft: rgba(194,41,97,.08); --hearth: rgba(217,106,76,.28) }
#tv.scene-night { --winA: #05070b; --winB: #020304; --shaft: rgba(0,0,0,0); --hearth: rgba(0,0,0,0) }

#set { position: absolute; inset: 0; transition: opacity 1.6s ease }
#set .wall { position: absolute; inset: 0;
  background:
    radial-gradient(120vw 70vh at 50% 108%, var(--hearth), transparent 62%),
    radial-gradient(90vw 90vh at 50% 42%, rgba(34,20,36,.55), transparent 70%),
    linear-gradient(#0c080c, #070508) }
#set .stone { position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay; background-size: 46vh 23vh }
#set .win { position: absolute; top: 9vh; width: 15vh; height: 58vh; filter: drop-shadow(0 0 5vh var(--shaft)) }
#set .win.l { left: 3.2vw } #set .win.r { right: 3.2vw }
#set .win svg { width: 100%; height: 100% }
.glassA { stop-color: var(--winA) } .glassB { stop-color: var(--winB) }
#set .shaft { position: absolute; top: 6vh; width: 42vw; height: 96vh; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(180deg, var(--shaft), transparent 78%);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000000 30%, #000000 60%, transparent); mask-image: linear-gradient(90deg, transparent, #000000 30%, #000000 60%, transparent);
  animation: shaft 13s ease-in-out infinite alternate }
#set .shaft.l { left: 2vw; transform-origin: 10% 0; transform: skewX(-28deg) }
#set .shaft.r { right: 2vw; transform-origin: 90% 0; transform: skewX(28deg); animation-delay: -6s }
@keyframes shaft { from { opacity: .65 } to { opacity: 1 } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
/* mist along the floor: two soft layers drifting past each other; only transforms move. Every blob stays inside its
   100vw tile (centre ± 70% of its size): one that crossed a tile edge was cut off there, a hard vertical line in the fog */
#tv { --fog: 214,200,176; --fogA: .5 }
#tv.scene-night, #tv.scene-table { --fog: 150,168,196; --fogA: .7 } #tv.scene-final { --fog: 190,120,130; --fogA: .6 } #tv.scene-morning { --fog: 255,214,180; --fogA: .6 }
#mist { position: absolute; left: 0; right: 0; bottom: 0; height: 34vh; overflow: hidden; pointer-events: none; opacity: var(--fogA); transition: opacity 3s ease;
  -webkit-mask-image: linear-gradient(0deg, #000000 30%, transparent); mask-image: linear-gradient(0deg, #000000 30%, transparent) }
#mist i { position: absolute; left: 0; bottom: -4vh; width: 200vw; height: 100%; will-change: transform; background-repeat: repeat-x; background-size: 100vw 100%;
  background-image: radial-gradient(26vw 11vh at 20% 72%, rgba(var(--fog),.24), transparent 70%), radial-gradient(30vw 13vh at 55% 76%, rgba(var(--fog),.2), transparent 70%), radial-gradient(22vw 10vh at 84% 68%, rgba(var(--fog),.22), transparent 70%);
  animation: drift 110s linear infinite }
#mist i + i { bottom: -8vh; opacity: .8; background-position: 37vw 0; animation-duration: 170s; animation-direction: reverse }
@keyframes drift { to { transform: translate3d(-100vw, 0, 0) } }
/* morning: a sunrise behind the stage and a few birds crossing the top of the hall */
#sun { position: absolute; left: 50%; bottom: -30vh; width: 130vh; height: 130vh; margin-left: -65vh; border-radius: 50%; pointer-events: none; opacity: 0; transform: translateY(18vh);
  background: radial-gradient(closest-side, rgba(246,188,169,.62), rgba(242,147,125,.3) 42%, rgba(220,169,135,.1) 62%, transparent 74%); transition: opacity 4s ease, transform 9s cubic-bezier(.2,.6,.2,1) }
#tv.scene-morning #sun { opacity: 1; transform: none }
#tv.scene-morning #stage .sub { color: var(--tallow); text-shadow: 0 .2vh 1.5vh rgba(0,0,0,.6) }
#tv.scene-day #sun { opacity: .35; transform: translateY(6vh) }
#birds { position: absolute; left: 0; right: 0; top: 9vh; height: 26vh; pointer-events: none; opacity: 0; transition: opacity 3s ease }
#tv.scene-morning #birds { opacity: .85 }
#birds i { position: absolute; left: 0; top: calc(var(--i) * 4.6vh); width: calc(3.6vh + var(--i) * .45vh); color: #f6bca9; filter: drop-shadow(0 0 .6vh rgba(245,171,150,.5)); transform: translateX(-10vw); animation: fly calc(19s + var(--i) * 3.5s) linear calc(var(--i) * -5.3s) infinite; will-change: transform }
#birds svg { width: 100%; fill: currentColor; overflow: visible } #birds g { transform-origin: 50% 60%; animation: flap .36s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.13s) }
@keyframes fly { 0% { transform: translate3d(-10vw, 2vh, 0) } 50% { transform: translate3d(50vw, -1.5vh, 0) } 100% { transform: translate3d(110vw, 1vh, 0) } }
@keyframes flap { from { transform: scaleY(1) } to { transform: scaleY(-.55) } }
/* night: a cold moon above the blindfolds */
#moon { position: absolute; right: 9vw; top: 7vh; width: 11vh; height: 11vh; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 2.5s ease; z-index: 1;
  background: radial-gradient(circle at 38% 36%, #f1ece9, #c9cfd8 55%, #8e98a6); box-shadow: 0 0 5vh 1.5vh rgba(200,214,235,.22), 0 0 16vh 6vh rgba(143,163,184,.12);
  -webkit-mask-image: radial-gradient(circle at 70% 40%, transparent 44%, #000000 46%); mask-image: radial-gradient(circle at 70% 40%, transparent 44%, #000000 46%); animation: moon 9s ease-in-out infinite alternate }
#tv.night #moon { opacity: .75 }
@keyframes moon { from { transform: translateY(0) } to { transform: translateY(1.2vh) } }
/* the last fifteen seconds of any clock: the room warms to red */
#vig::after { content: ""; position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(194,41,97,.4) 100%); transition: opacity 1s ease }
#tv.hurry #vig::after { opacity: 1; animation: hurry 1s ease-in-out infinite alternate }
@keyframes hurry { from { opacity: .45 } to { opacity: 1 } }
/* a Cloak revealed: the room jolts */
#stage.shake { animation: shake .75s cubic-bezier(.36,.07,.19,.97) both }
@keyframes shake { 10%, 90% { transform: translate3d(-.3vh, 0, 0) } 20%, 80% { transform: translate3d(.6vh, 0, 0) } 30%, 50%, 70% { transform: translate3d(-1vh, .2vh, 0) } 40%, 60% { transform: translate3d(1vh, -.2vh, 0) } }
#grain { position: absolute; inset: -10%; pointer-events: none; opacity: .11; mix-blend-mode: overlay; background-size: 220px 220px }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0,0,0,.62) 100%) }
#dim { position: absolute; inset: 0; pointer-events: none; background: #000000; opacity: calc((1 - var(--light)) * .42); transition: opacity 3s ease }

/* night: the room goes black and breathes red */
#veil { position: absolute; inset: 0; background: #000000; opacity: 0; transition: opacity 1.4s ease; pointer-events: none }
#veil::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70vw 60vh at 50% 58%, rgba(122,20,57,.34), transparent 70%); animation: breathe 6.3s ease-in-out infinite }
@keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
#tv.night #veil { opacity: 1 }
#tv.night #top, #tv.night #rail { opacity: 0; transform: translateY(2vh) }

/* ---------- top bar ---------- */
#top { position: absolute; left: 0; right: 0; top: 0; height: 8vh; padding: 0 4vw; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  font-family: var(--sc); font-weight: 500; font-size: 2.15vh; letter-spacing: .34em; color: var(--tallow2); transition: opacity 1s ease, transform 1s ease; z-index: 3 }
#top .brandline { display: flex; align-items: center; gap: 1.2vh; color: var(--brass2); font-family: var(--disp); font-size: 3.3vh; letter-spacing: .04em; font-weight: 500 }
#top .brandline svg { width: 3.4vh; height: 3.4vh }
#top .potbox { justify-self: end; display: flex; align-items: baseline; gap: 1.2vh }
#top .potbox b { font-family: var(--disp); font-weight: 600; font-size: 3.9vh; letter-spacing: .02em; color: var(--brass2) }
#top .fin { color: var(--blood2) }
#top::after { content: ""; position: absolute; left: 4vw; right: 4vw; bottom: 0; height: max(1px, .1vh); background: linear-gradient(90deg, transparent, rgba(174,98,73,.55) 18%, rgba(174,98,73,.55) 82%, transparent) }

/* ---------- stage ---------- */
#stage { position: absolute; left: 0; right: 0; top: 8vh; bottom: 27vh; padding: 1vh 19vh 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.5vh; z-index: 2; min-height: 0 }
#tv.norail #stage { bottom: 3vh }
#stage:has(.rolls.many) { gap: .9vh } #stage:has(.rolls.many) .prizeline { padding-top: .6vh; padding-bottom: .7vh }
#tv.night #stage { top: 0; bottom: 0; padding: 6vh 12vw }
:where(#stage) > * { max-width: 100%; flex: none }
.eyebrow { font-family: var(--sc); font-weight: 500; font-size: 2.5vh; letter-spacing: .46em; text-indent: .46em; color: var(--brass); text-transform: lowercase }
.eyebrow.steel { color: var(--steel) }
h1 { margin: 0; font-family: var(--disp); font-weight: 500; font-size: 9.6vh; line-height: .98; letter-spacing: .005em; color: var(--tallow); text-wrap: balance }
h1.md { font-size: 7.4vh } h1.sm { font-size: 5.8vh } h1.xl { font-size: 13vh }
.gold { background: linear-gradient(176deg, #f4c9b7 8%, var(--brass2) 38%, var(--brass) 66%, #81432f 96%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .3vh 1.6vh rgba(217,109,76,.28)) }
h1.gold, #card .pct.gold { background-image: linear-gradient(104deg, transparent 43%, rgba(249,240,234,.95) 50%, transparent 57%), linear-gradient(176deg, #f4c9b7 8%, var(--brass2) 38%, var(--brass) 66%, #81432f 96%);
  background-size: 260% 100%, 100% 100%; background-repeat: no-repeat; background-position: 160% 0, 0 0 }
@keyframes shimmer { 0%, 72% { background-position: 160% 0, 0 0 } 100% { background-position: -60% 0, 0 0 } }
h1.gold:not(.fx-title):not(.fx-slam) { animation: shimmer 8s ease-in-out 1.5s infinite }
.blood { color: var(--blood); text-shadow: 0 0 3vh rgba(194,41,97,.55), 0 .3vh 0 #2b0614 }
.sub { font-family: var(--book); font-style: italic; font-size: 3.5vh; line-height: 1.22; color: var(--tallow2); max-width: 62vw; text-wrap: balance }
/* the prize, named at last on the final screen */
/* the prize card: one labelled line per prize */
.prizes { display: flex; flex-direction: column; gap: 1.6vh; max-width: 70vw; text-align: left }
.prz { display: flex; align-items: center; gap: 2.4vh; padding: 1.2vh 2.4vh; border: max(1px, .1vh) solid rgba(174,98,73,.4); border-radius: .8vh; background: rgba(9,7,10,.55) }
.przico { display: flex; gap: .4vh; flex: none } .przico svg { width: 7vh; height: 7vh; color: var(--brass2) }
.prz b { display: block; font-family: var(--sc); font-weight: 700; letter-spacing: .12em; font-size: 2.8vh; color: var(--brass2) }
.prz span { display: block; font-family: var(--book); font-size: 2.6vh; line-height: 1.25; color: var(--tallow); text-wrap: pretty }
#tv.big .prz b { font-size: 3.1vh } #tv.big .prz span { font-size: 2.9vh }
@media (max-aspect-ratio: 3/2) { .prizes { max-width: 84vw } #tv.big .prz span { font-size: 2.5vh } }
.prizeline { display: flex; flex-direction: column; align-items: center; gap: .5vh; padding: .9vh 5vh 1.1vh; max-width: 72vw; border-top: max(1px, .12vh) solid rgba(174,98,73,.5); border-bottom: max(1px, .12vh) solid rgba(174,98,73,.5); background: radial-gradient(ellipse at center, rgba(174,98,73,.14), transparent 70%) }
.prizeline span { font-family: var(--sc); font-weight: 500; font-size: 2.3vh; letter-spacing: .46em; text-indent: .46em; color: var(--brass); text-transform: lowercase }
.prizeline b { font-family: var(--disp); font-weight: 500; font-size: 5.4vh; line-height: 1.02; color: var(--brass2); text-wrap: balance; text-shadow: 0 0 2.4vh rgba(230,165,140,.35) }
.prizeline em { font-family: var(--book); font-size: 2.9vh; line-height: 1.2; color: var(--tallow); text-wrap: balance }
.sub.small { font-size: 2.6vh; opacity: .8 } .sub.wrong { color: var(--blood2) } .sub b { color: var(--brass2); font-weight: 400 }
.rule { width: 26vh; height: 1.4vh; flex: none; position: relative; opacity: .9 }
.rule::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: max(1px, .1vh); background: linear-gradient(90deg, transparent, var(--brass), transparent) }
.rule::after { content: ""; position: absolute; left: 50%; top: 50%; width: .9vh; height: .9vh; background: var(--brass2); transform: translate(-50%, -50%) rotate(45deg) }
.rules { font-family: var(--book); font-size: 3.7vh; line-height: 1.3; max-width: 66vw; color: var(--tallow); text-wrap: pretty }
.tag { display: inline-flex; align-items: center; gap: 1vh; padding: .7vh 2.2vh; border: max(1px, .1vh) solid rgba(174,98,73,.6); font-family: var(--sc); font-size: 2.3vh; letter-spacing: .3em; color: var(--brass2); background: rgba(174,98,73,.08) }
.q { font-family: var(--book); font-size: 6vh; line-height: 1.14; max-width: 68vw; color: var(--tallow); text-wrap: balance }
.a { font-family: var(--disp); font-weight: 600; font-size: 9vh; line-height: 1 }
.letters { display: flex; gap: .9vh; justify-content: center }
.letters span { width: 6.6vh; height: 8.2vh; display: grid; place-items: center; font-family: var(--book); font-weight: 400; font-size: 6.4vh; line-height: 1; color: #170c18; background: linear-gradient(170deg, #efd4ca, #c7a192); border-radius: .5vh; box-shadow: 0 .5vh 1.2vh rgba(0,0,0,.6), inset 0 -.4vh 0 rgba(0,0,0,.18); animation: deal .5s both cubic-bezier(.2,.9,.3,1.2); animation-delay: calc(var(--i) * 55ms) }
@keyframes deal { from { opacity: 0; transform: translateY(-3vh) rotate(-8deg) scale(.8) } }
.memgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1.2vh 1.4vh; width: 66vw }
.memgrid div { padding: 1.7vh .5vh; font-family: var(--book); font-size: 4vh; border: max(1px, .1vh) solid rgba(174,98,73,.35); background: rgba(9,7,10,.55); animation: rise .5s both; animation-delay: calc(var(--i) * 30ms) }
.hilo { display: flex; flex-direction: column; align-items: center; gap: .4vh } .hilo span { font-family: var(--sc); letter-spacing: .3em; font-size: 2.4vh; color: var(--brass) }
.hilo b { font-family: var(--disp); font-weight: 600; font-size: 10vh; line-height: 1; color: var(--tallow) }
.a .hl { font-family: var(--sc); font-style: normal; font-size: .4em; letter-spacing: .3em; margin-left: .4em; vertical-align: middle; color: var(--brass2) }
.chgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2vh 3vh; width: min(100vw - 6.4vw - 36vh, 150vh) }
.chgrid div { aspect-ratio: 1; display: grid; place-items: center; font-size: 11vh; color: var(--brass2); border: max(1px, .12vh) solid rgba(174,98,73,.35); border-radius: 1.2vh; background: rgba(9,7,10,.5); animation: rise .5s both; animation-delay: calc(var(--i) * 40ms) }
.chgrid div .ico { stroke-width: 1.8 } .chgrid div.hit { color: #ffffff; border-color: var(--blood2); background: rgba(122,20,57,.45); box-shadow: 0 0 3vh rgba(194,41,97,.6); animation: slam .5s both }
.bigico { font-size: 30vh; color: var(--brass2); filter: drop-shadow(0 0 4vh rgba(217,109,76,.35)) }
.bigico .ico { stroke-width: 1.7 }
.snaplist { display: flex; gap: 3vh; font-size: 6vh; color: var(--brass) }
.leader { display: flex; gap: 3vh; justify-content: center; align-items: flex-end }
.leader .who { display: flex; flex-direction: column; align-items: center; gap: .6vh; font-family: var(--sc); letter-spacing: .2em; font-size: 2.2vh; color: var(--tallow2) }
.leader .who .seal { width: 7vh; height: 7vh } .leader .who:first-child .seal { width: 9.5vh; height: 9.5vh }
.leader .who b { font-family: var(--disp); font-size: 4vh; color: var(--brass2); letter-spacing: 0 }

/* entrances: run when a node is inserted; the morph keeps existing nodes, so nothing replays */
.fx-rise { animation: rise .9s both cubic-bezier(.2,.7,.2,1); animation-delay: var(--d, 0s) }
.fx-fade { animation: fade 1.2s both ease; animation-delay: var(--d, 0s) }
.fx-title { animation: title 1.5s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both, shimmer 8s ease-in-out calc(var(--d, 0s) + 1.6s) infinite }
.fx-flip { animation: flip .8s both cubic-bezier(.2,.8,.2,1.15); animation-delay: var(--d, 0s) }
.fx-slam { animation: slam .55s cubic-bezier(.2,.9,.3,1.3) var(--d, 0s) both, shimmer 8s ease-in-out calc(var(--d, 0s) + 1s) infinite }
@keyframes rise { from { opacity: 0; transform: translateY(2.4vh) } }
@keyframes fade { from { opacity: 0 } }
@keyframes title { from { opacity: 0; letter-spacing: .16em; filter: blur(.8vh) } }
@keyframes flip { from { opacity: 0; transform: perspective(90vh) rotateX(-80deg) } }
@keyframes slam { from { opacity: 0; transform: scale(2.2) } }
/* backwards, not forwards: a letter held by its finished animation keeps its own layer, and each layer boxed in its own glow */
.typed span { display: inline-block; animation: ink .5s backwards; animation-delay: calc(var(--i) * 95ms + .2s) }
@keyframes ink { from { opacity: 0; transform: translateY(-1.2vh) scale(1.35); filter: blur(.6vh) } to { opacity: 1 } }
.bleed { animation: bleed 2.6s both ease-out }
@keyframes bleed { 0% { opacity: 0; color: var(--tallow); text-shadow: none; filter: blur(1vh) } 40% { opacity: 1; color: var(--tallow); filter: blur(0) } 100% { color: var(--blood); text-shadow: 0 0 3vh rgba(194,41,97,.6), 0 .8vh 1.6vh rgba(122,20,57,.9) } }

/* ---------- timer ring ---------- */
.ring { position: relative; width: 30vh; height: 30vh; flex: none }
.ring.sm { width: 21vh; height: 21vh }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .bg { fill: rgba(9,7,10,.5); stroke: rgba(174,98,73,.22); stroke-width: 2.2 }
.ring .dash { fill: none; stroke: rgba(174,98,73,.4); stroke-width: .6; stroke-dasharray: .8 4.43 }
.ring .fg { fill: none; stroke: url(#g-ring); stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 283; transition: stroke-dashoffset .3s linear }
.ring .time { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--disp); font-weight: 500; font-size: 9vh; color: var(--tallow) }
.ring.sm .time { font-size: 6.2vh }
.ring.low .fg { stroke: var(--blood) } .ring.low .time { color: var(--blood2) } .ring.low { animation: pulse 1s ease-in-out infinite }
@keyframes pulse { 50% { transform: scale(1.035); filter: drop-shadow(0 0 3vh rgba(194,41,97,.6)) } }
.digits span { display: inline-block; width: .56em; text-align: center } .digits span.c { width: .3em }

/* ---------- candle rail: one candle for every guest ---------- */
#rail { position: absolute; left: 0; right: 0; bottom: 0; height: 27vh; z-index: 2; transition: opacity 1s ease, transform 1s ease }
#tv.norail #rail { opacity: 0; transform: translateY(8vh); pointer-events: none }
#rail .apron { position: absolute; left: 0; right: 0; bottom: 0; height: 11.2vh; background: linear-gradient(180deg, #402145 0, #27142a 6%, #180c1a 40%, #0c070c 100%); box-shadow: 0 -1.2vh 5vh rgba(217,106,76,.10) }
#rail .apron::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .35vh; background: linear-gradient(90deg, transparent, var(--brass) 12%, var(--brass2) 50%, var(--brass) 88%, transparent); opacity: .85 }
#rail .apron::after { content: ""; position: absolute; left: 6vw; right: 6vw; top: 1.5vh; height: max(1px, .1vh); background: rgba(174,98,73,.25) }
#rail .row { position: absolute; left: 17vh; right: 17vh; bottom: 0; top: 0; display: flex; justify-content: center }
#rail .row.stagger .seat:nth-child(even) .plaque { bottom: 3.9vh } #rail .row.stagger .seat .plaque { max-width: 190%; z-index: 1 } #rail .row.stagger .seat:nth-child(even) .seal { bottom: 6.6vh; width: 5vh; height: 5vh } #rail .row.stagger .seat:nth-child(odd) .seal { bottom: 4.4vh; width: 5.4vh; height: 5.4vh }
.seat { position: relative; flex: 0 1 14vh; min-width: 0; height: 100% }
.seat .badge { position: absolute; left: 50%; bottom: calc(11.2vh + var(--h) + 6.2vh); transform: translateX(-50%); min-width: 4.8vh; height: 4.8vh; padding: 0 1vh; display: grid; place-items: center; font-family: var(--disp); font-weight: 600; font-size: 3.7vh; color: var(--brass2); background: rgba(9,7,10,.78); border: max(1px, .1vh) solid rgba(174,98,73,.55); border-radius: 2.2vh; animation: slam .45s both }
.seat .badge.chalk { color: #efebe9; border-color: rgba(239,235,233,.5); background: #1b201d; border-radius: .4vh }
.seat .badge.zero { opacity: .32; animation: none }
.seat .candle { position: absolute; left: 50%; bottom: 11.2vh; width: 2.5vh; height: var(--h); transform: translateX(-50%); transition: height 2.4s ease }
.seat .wax { position: absolute; inset: 0; border-radius: .5vh .5vh .2vh .2vh; background: linear-gradient(90deg, #9b887c, #ebd2c8 38%, #f4e1d9 52%, #aa978a 100%); box-shadow: inset 0 1.2vh 1.6vh rgba(240,138,105,.45) }
.seat .wax::before { content: ""; position: absolute; left: -.25vh; top: -.2vh; width: .9vh; height: 2.4vh; border-radius: .5vh; background: linear-gradient(90deg, #c8a699, #efd9d0) }
.seat .wax::after { content: ""; position: absolute; left: 50%; top: -1vh; width: .22vh; height: 1.1vh; background: #160b18; transform: translateX(-50%) }
.seat .cup { position: absolute; left: 50%; bottom: -.1vh; width: 4.6vh; height: 1.1vh; transform: translateX(-50%); border-radius: .3vh .3vh 1.2vh 1.2vh; background: linear-gradient(90deg, #49254e, var(--brass2) 45%, #582c5f) }
.seat .halo { position: absolute; left: 50%; top: -3.4vh; width: 17vh; height: 17vh; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(242,152,123,.34), rgba(238,118,87,.10) 38%, transparent 66%); animation: flick 3.1s ease-in-out infinite; animation-delay: var(--fd); pointer-events: none; transition: opacity 1.2s }
.seat .flame { position: absolute; left: 50%; bottom: calc(100% + .7vh); width: 2.1vh; height: 4.6vh; margin-left: -1.05vh; transform-origin: 50% 100%; animation: flame 1.7s ease-in-out infinite; animation-delay: var(--fd); transition: transform .9s ease, opacity .9s ease }
.seat .flame svg { width: 100%; height: 100%; overflow: visible }
@keyframes flame { 0%, 100% { transform: scale(1, 1) skewX(0) } 22% { transform: scale(.94, 1.07) skewX(2.5deg) } 47% { transform: scale(1.05, .95) skewX(-2deg) } 71% { transform: scale(.97, 1.04) skewX(1.5deg) } }
@keyframes flick { 0%, 100% { opacity: .92 } 30% { opacity: 1 } 55% { opacity: .82 } 80% { opacity: .97 } }
.seat .smoke { position: absolute; left: 50%; bottom: calc(100% + .4vh); width: 1.2vh; height: 9vh; margin-left: -.6vh; opacity: 0; background: linear-gradient(0deg, rgba(200,200,200,.5), transparent); filter: blur(.5vh); border-radius: 50%; animation: smoke 3.4s ease-out 1 }
@keyframes smoke { 0% { opacity: 0; transform: translateY(0) scaleX(.6) } 18% { opacity: .8 } 100% { opacity: 0; transform: translateY(-8vh) scaleX(2.4) } }
.seat.unlit .flame, .seat.out .flame { transform: scale(0); opacity: 0; animation: none }
.seat.unlit .halo, .seat.out .halo { opacity: 0; animation: none }
.seat.unlit .wax, .seat.out .wax { box-shadow: none; filter: brightness(.55) saturate(.7) }
.seat.out .candle { height: calc(var(--h) * .45) }
.seat.lighting .flame { animation: ignite .7s both cubic-bezier(.2,.8,.2,1.4), flame 1.7s ease-in-out .7s infinite; animation-delay: var(--ld), calc(var(--ld) + .7s) }
.seat.lighting .halo { animation: fadeHalo 1.2s both, flick 3.1s ease-in-out infinite; animation-delay: var(--ld), calc(var(--ld) + 1.2s) }
.seat.lighting .plaque, .seat.lighting .seal { animation: litup 1s both; animation-delay: var(--ld) }
@keyframes ignite { from { transform: scale(0); opacity: 0 } } @keyframes fadeHalo { from { opacity: 0 } } @keyframes litup { from { filter: brightness(.3) saturate(.3) } }
.seat .seal { position: absolute; left: 50%; bottom: 4.1vh; width: 6.2vh; height: 6.2vh; transform: translateX(-50%); transition: filter 1.5s, opacity 1.5s }
.seat .plaque { position: absolute; left: 50%; bottom: 1vh; transform: translateX(-50%); max-width: 122%; padding: .15vh 1vh .25vh; font-family: var(--sc); font-weight: 700; font-size: var(--fit, 1.95vh); letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b0d1d; background: linear-gradient(180deg, #e0a791, #a55b41 60%, #763c29); border-radius: .25vh; box-shadow: 0 .3vh .8vh rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35) }
.seat.unlit .seal, .seat.unlit .plaque { filter: brightness(.42) saturate(.5) }
.seat.out .seal { filter: grayscale(.9) brightness(.45) } .seat.out .plaque { filter: none; color: #c0b4ac; background: linear-gradient(180deg, #463b48, #302632); text-decoration: line-through; text-decoration-color: rgba(192,180,172,.45); text-decoration-thickness: .06em }
.seat.hot .seal { animation: hot 1.1s ease-in-out infinite } .seat.hot .plaque { background: linear-gradient(180deg, #ea5a8f, #a51c4e 60%, #5d0d2a); color: #ffffff }
@keyframes hot { 50% { filter: drop-shadow(0 0 1.6vh rgba(234,90,143,.95)) } }
.seat.dim { opacity: .38 }
.seat .shieldmark { position: absolute; left: calc(50% + 1.4vh); bottom: 7.2vh; width: 3.6vh; height: 3.6vh; display: grid; place-items: center; font-size: 2.3vh; color: #d9fff0; background: radial-gradient(circle at 35% 30%, #4fa98c, #1d5443); border: max(1px, .1vh) solid #9fe0c6; border-radius: 50%; box-shadow: 0 0 1.4vh rgba(95,168,143,.75); animation: slam .5s both }
.seat .shieldmark .ico { stroke-width: 4 }
.seat .warmark { left: auto; right: calc(50% + 1.4vh); color: #f8c8b7; background: radial-gradient(circle, rgba(194,41,97,.85), rgba(122,20,57,.9)); border-color: rgba(230,165,140,.8) }
.rt .rtmark { position: absolute; width: 3.8vh; height: 3.8vh; margin: -6.4vh 0 0 1.6vh; display: grid; place-items: center; font-size: 2.3vh; border-radius: 50%; border: max(1px, .12vh) solid rgba(230,165,140,.8); z-index: 2 }
.rt .rtmark.low { margin: 1.4vh 0 0 1.6vh } .rt .rtmark.safe { color: #d9fff0; background: radial-gradient(circle, rgba(95,168,143,.95), rgba(46,107,87,.95)) } .rt .rtmark.war { color: #f8c8b7; background: radial-gradient(circle, rgba(194,41,97,.9), rgba(122,20,57,.95)) }
.rt .rtmark .ico { stroke-width: 4 } .rt .place.faded .chairseal, .rt .place.faded .nm { opacity: .35 } .rt .place.safe .chairseal { filter: drop-shadow(0 0 1.4vh rgba(95,168,143,.9)) }
.rtcopy .rtag { align-self: flex-start; letter-spacing: .14em; font-size: 1.9vh; line-height: 1.3 } .rtcopy .rtag.safe { border-color: rgba(95,168,143,.7); color: #bff3de; background: rgba(46,107,87,.15) }
.ballot { display: flex; flex-direction: column; gap: .6vh } .ballot span { font-family: var(--book); font-style: italic; font-size: 3vh; color: var(--tallow2) }
.ballot b { font-family: var(--disp); font-weight: 600; font-size: 7vh; line-height: 1; color: var(--blood2); text-shadow: 0 0 2.4vh rgba(194,41,97,.45) } .ballot em { font-family: var(--sc); font-style: normal; letter-spacing: .24em; font-size: 2vh; color: var(--brass2) }
.seal text { font-family: var(--disp); font-weight: 600; font-size: 46px; text-anchor: middle }
.seal.cracked .crack { display: block } .seal .crack { display: none }

/* ---------- the Reckoning table (top-down) ---------- */
.rtwrap { display: flex; align-items: center; justify-content: center; gap: 2.5vw; width: 100% }
.rtcopy { width: 25vw; text-align: left; display: flex; flex-direction: column; gap: 1.6vh }
.rtcopy .eyebrow { text-indent: 0 } .rtcopy .sub { max-width: none }
.rt { position: relative; width: 74vh; height: 74vh; flex: none }
.rt .disc { position: absolute; inset: 17%; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, rgba(240,135,105,.10), transparent 60%), repeating-conic-gradient(from 12deg, #321936 0 2.4deg, #28142b 2.4deg 5.1deg, #371c3b 5.1deg 7deg), #251428;
  box-shadow: 0 0 0 .7vh #170c18, 0 0 0 1vh var(--brass3), 0 0 0 1.25vh #0f0810, 0 3vh 8vh rgba(0,0,0,.85), inset 0 0 9vh rgba(0,0,0,.75) }
.rt .disc::before { content: ""; position: absolute; inset: 7%; border-radius: 50%; border: max(1px, .1vh) solid rgba(174,98,73,.55); box-shadow: inset 0 0 0 .5vh rgba(0,0,0,.25), inset 0 0 0 .6vh rgba(174,98,73,.3) }
.rt .disc::after { content: ""; position: absolute; inset: 24%; border-radius: 50%; background: radial-gradient(circle, #33101d, #1d0910 70%); box-shadow: 0 0 0 1px rgba(174,98,73,.6), inset 0 0 4vh rgba(0,0,0,.7) }
.rt .inlay { position: absolute; inset: 17%; opacity: .5 } .rt .inlay svg { width: 100%; height: 100% }
.rt .mid { position: absolute; inset: 34%; display: grid; place-items: center; color: var(--brass2) }
.rt .mid .crest { width: 58%; height: 58%; opacity: .85 }
.rt .place { position: absolute; left: 50%; top: 50%; width: 0; height: 0 }
.rt .pool { position: absolute; width: 15vh; height: 15vh; margin: -7.5vh; border-radius: 50%; background: radial-gradient(circle, rgba(245,175,150,.85) 0 4%, rgba(240,130,99,.34) 9%, rgba(237,109,78,.10) 36%, transparent 62%); animation: flick 2.9s ease-in-out infinite; animation-delay: var(--fd); mix-blend-mode: screen }
.rt .place.out .pool { background: radial-gradient(circle, #170d19 0 5%, transparent 6%); animation: none; mix-blend-mode: normal }
.rt .chairseal { position: absolute; width: 8.4vh; height: 8.4vh; margin: -4.2vh; transition: filter .6s }
.rt .place.out .chairseal { filter: grayscale(.9) brightness(.4) } .rt .place.out .nm { opacity: .72; color: #c0b4ac; text-decoration: line-through; text-decoration-color: rgba(192,180,172,.45); text-decoration-thickness: .06em }
.rt .nm { position: absolute; transform: translate(-50%, -50%); padding: .1vh 1vh .2vh; font-family: var(--sc); font-weight: 700; font-size: 2vh; letter-spacing: .12em; white-space: nowrap; color: #1b0d1d; background: linear-gradient(180deg, #e0a791, #a55b41 60%, #763c29); border-radius: .25vh; box-shadow: 0 .3vh .8vh rgba(0,0,0,.6) }
.rt .nm.side { white-space: normal; max-width: 15vh; width: max-content; text-align: center; line-height: 1.15 }
.rt .votes { position: absolute; transform: translate(-50%, -50%); min-width: 4.6vh; height: 4.6vh; padding: 0 .8vh; display: grid; place-items: center; font-family: var(--disp); font-weight: 600; font-size: 3.6vh; color: #f1edeb; background: #1b201d; border: max(1px, .1vh) solid rgba(239,235,233,.55); border-radius: .4vh; box-shadow: 0 .4vh 1vh rgba(0,0,0,.7); animation: slam .45s both }
.rt .place.lead .chairseal { animation: hot 1.1s ease-in-out infinite } .rt .place.lead .votes { background: var(--ox); border-color: var(--blood2) }

/* ---------- cards: role reveal, votes ---------- */
.rolecard { width: 36vh; height: 47vh; perspective: 140vh; flex: none }
.rolecard .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: turn 1.5s .9s both cubic-bezier(.3,.7,.2,1) }
@keyframes turn { from { transform: rotateY(180deg) } to { transform: rotateY(0) } }
.rolecard .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 1.2vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vh; border: max(1px, .1vh) solid rgba(174,98,73,.7); box-shadow: 0 2vh 6vh rgba(0,0,0,.8), inset 0 0 0 .7vh rgba(9,7,10,.9), inset 0 0 0 .8vh rgba(174,98,73,.45) }
.rolecard .back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, #190e1a 0 1.2vh, #1c101e 1.2vh 2.4vh); color: var(--brass) }
.rolecard .back .crest { width: 46% }
.rolecard .front.t { background: radial-gradient(circle at 50% 38%, #4a0f25, #16060c 75%) } .rolecard .front.f { background: radial-gradient(circle at 50% 38%, #331a37, #100811 75%) }
.rolecard .word { font-family: var(--disp); font-weight: 600; font-size: 7.4vh; line-height: 1 }
.rolecard .front.t .word { color: var(--blood2); text-shadow: 0 0 3vh rgba(194,41,97,.7) }
.rolecard .who { font-family: var(--sc); letter-spacing: .3em; font-size: 2.4vh; color: var(--tallow2) }
.bigseal { width: 17vh; height: 17vh; animation: stamp .6s 2s both cubic-bezier(.2,.9,.3,1.25) } .bigseal svg { width: 100%; height: 100% }
@keyframes stamp { from { opacity: 0; transform: scale(2.6) rotate(-14deg) } }
.votecards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6vh; max-width: 86vw }
.vcard { width: auto; min-width: 14vh; max-width: 21vh; padding: 1.4vh .6vh 1.2vh; display: flex; flex-direction: column; align-items: center; gap: .8vh; background: rgba(9,7,10,.72); border: max(1px, .1vh) solid rgba(174,98,73,.4); border-radius: .8vh; transition: background .6s, border-color .6s }
.votecards.many .vcard { min-width: 12.5vh; max-width: 19vh; padding: .9vh .4vh .7vh; gap: .5vh } .votecards.many .vcard .seal { width: 3.6vh; height: 3.6vh } .votecards.many .vseal { width: 6vh; height: 6vh } .votecards.many .vword { font-size: 2vh } .votecards.many .vn { font-size: 2vh }
/* up to eight cards: always one row; cards give up width (long names wrap inside) rather than wrap into a second row */
.votecards:not(.many) { flex-wrap: nowrap } .votecards:not(.many) .vcard { flex-shrink: 1; min-width: 0 }
/* six to eight: one row that shares the width, so the ceremony never wraps into a second row */
.votecards.mid { flex-wrap: nowrap; width: 100% } .votecards.mid .vcard { flex: 1 1 0; min-width: 0; max-width: 19vh; padding: 1.2vh .5vh 1vh } .votecards.mid .vcard .vn { font-size: 1.9vh; letter-spacing: .03em } .votecards.mid .vseal { width: 7vh; height: 7vh }
.votecards.few .vcard { min-width: 21vh; max-width: 26vh; padding: 2vh 1vh } .votecards.few .vcard .vseal { width: 12vh; height: 12vh } .votecards.few .vword { font-size: 3.4vh }
.vcard .seal { width: 5vh; height: 5vh } .vcard .vn { font-family: var(--sc); font-weight: 700; letter-spacing: .06em; font-size: 2.2vh; line-height: 1.1; max-width: 100%; text-align: center; text-wrap: balance; overflow-wrap: anywhere }
.vcard .vseal { width: 8vh; height: 8vh } .vcard .vseal svg { width: 100%; height: 100% }
.vcard .vseal.blank { border-radius: 50%; border: max(1px, .1vh) dashed rgba(174,98,73,.4) }
.vcard .vseal.stamped { animation: stamp .5s both cubic-bezier(.2,.9,.3,1.25) }
.vcard .vword { font-family: var(--sc); font-weight: 700; letter-spacing: .15em; text-indent: .15em; font-size: 2.5vh; color: var(--mist) }
.vcard.good .vseal, .vcard.bad .vseal { filter: drop-shadow(0 .6vh 1.6vh rgba(0,0,0,.6)) }
.vcard.good { background: rgba(46,107,87,.28); border-color: var(--verd) } .vcard.good .vword { color: #9fe0c6 }
.vcard.bad { background: rgba(122,20,57,.4); border-color: var(--blood) } .vcard.bad .vword { color: var(--blood2) }
.rolls { display: grid; gap: 1.2vh 1.6vh; width: 100%; max-width: calc(100vw - 6.4vw - 36vh) }
.rolls > div { display: flex; align-items: center; gap: 1.2vh; padding: .9vh 1.2vh; border: max(1px, .1vh) solid rgba(174,98,73,.3); background: rgba(9,7,10,.6); animation: flip .7s both; animation-delay: var(--d); text-align: left; min-width: 0 }
.rolls .seal { width: 6.4vh; height: 6.4vh; flex: none } .rolls span { min-width: 0; flex: 1 } .rolls b { display: block; font-family: var(--sc); letter-spacing: .05em; font-size: 2.4vh; line-height: 1.1 }
.rolls small { font-family: var(--book); font-style: italic; font-size: 2.3vh; color: var(--tallow2) }
.rolls .t { border-color: var(--blood); background: rgba(122,20,57,.35) } .rolls .t small { color: var(--blood2) }
.rulelist { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vh 4vw; width: 100%; max-width: calc(100vw - 6.4vw - 36vh); text-align: left; font-family: var(--book); font-size: 3vh; line-height: 1.24; color: var(--tallow2) }
.rulelist b { font-family: var(--sc); font-weight: 700; letter-spacing: .14em; color: var(--brass2); font-size: 1.02em }
@media (max-aspect-ratio: 3/2) { .rulelist { gap: 1.1vh 3vw; font-size: 2.6vh } }
.rulelist.ghostrules { grid-template-columns: 1fr; max-width: 64vw; margin: 1vh auto 0; font-size: 3.2vh }
.quizpart { display: flex; gap: 2vh; justify-content: center; align-items: baseline; font-family: var(--sc); font-weight: 700; letter-spacing: .16em; font-size: 2.1vh; color: var(--tallow2); animation: rise .6s both }
.quizpart .pt { color: var(--brass2); padding: .4vh 1.6vh; border: max(1px, .12vh) solid rgba(230,165,140,.45); border-radius: 99px; background: rgba(174,98,73,.12) }
.rulelist div { padding-left: 1.6vh; border-left: max(1px, .1vh) solid rgba(174,98,73,.45); animation: rise .7s both; animation-delay: calc(var(--i) * 70ms) }

/* night slides */
.nightwho { font-family: var(--sc); font-weight: 500; letter-spacing: .5em; text-indent: .5em; font-size: 3vh; color: var(--blood2) }
.nighttext { font-family: var(--book); font-size: 5.6vh; line-height: 1.22; color: #ecbaa7; max-width: 76vw; text-wrap: balance; text-shadow: 0 0 4vh rgba(230,165,140,.22) }
.nighttext.short { font-family: var(--disp); font-weight: 500; font-size: 10.5vh; line-height: 1.02 }
.nighttext.mid { font-size: 7.2vh; line-height: 1.16 }
.nighttext.long { font-size: 4.7vh }
.nightn { font-family: var(--sc); letter-spacing: .3em; font-size: 2vh; color: rgba(230,165,140,.35) }

/* crest + wordmark */
.crest { color: var(--brass2) } .crest svg { width: 100%; height: 100% }
.crestbig { width: 17vh; height: 20vh; flex: none }
.draw path, .draw circle, .draw line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s .2s forwards ease-in-out }
.draw .fillin { opacity: 0; animation: fade 1.2s 2s forwards }
@keyframes draw { to { stroke-dashoffset: 0 } }
.wordmark { font-family: var(--disp); font-weight: 600; font-size: 14.5vh; line-height: .9; letter-spacing: -.005em }
.wordmark.long { font-size: 11vh }

/* overlays */
#card { position: absolute; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; background: #000000; text-align: center }
#card.on { display: flex; animation: cardio var(--cd, 2.6s) both ease }
@keyframes cardio { 0% { opacity: 0 } 5% { opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
/* the blade decided an exile: it falls, strikes, and a drop of blood runs from the tip */
.stab { position: relative; width: 14vh; height: 14vh; margin: 0 auto -5.5vh; pointer-events: none; z-index: 4 }
.stab .knife { position: absolute; inset: 0; animation: stab 1s cubic-bezier(.6,0,.9,.3) .2s both }
.stab .knife svg { width: 100%; height: 100%; color: #e4d4ce; filter: drop-shadow(0 0 1.4vh rgba(0,0,0,.9)) drop-shadow(0 0 3vh rgba(194,41,97,.35)) }
.stab .drop { position: absolute; left: 6.1vh; top: 12.6vh; width: 1.8vh; height: 2.5vh; background: radial-gradient(circle at 35% 35%, #ff6ba1, var(--blood) 45%, var(--ox)); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 0; animation: drip 2.4s ease-in 1.3s both }
.stab .splat { position: absolute; left: 4.2vh; top: 31vh; width: 5.6vh; height: 1.6vh; border-radius: 50%; background: radial-gradient(ellipse, var(--blood) 40%, rgba(122,20,57,0) 72%); opacity: 0; animation: splat .6s ease-out 3.6s both }
@keyframes stab { 0% { transform: translateY(-40vh); opacity: 0 } 12% { opacity: 1 } 70% { transform: translateY(1.2vh) } 80% { transform: translateY(-.6vh) rotate(-2deg) } 90% { transform: translateY(.3vh) rotate(1deg) } 100% { transform: translateY(0) } }
@keyframes drip { 0% { transform: scale(0); opacity: 0 } 20% { transform: scale(1, 1); opacity: 1 } 45% { transform: scale(.95, 1.25) } 100% { transform: translateY(18vh) scale(.85, 1.35); opacity: 1 } }
@keyframes splat { 0% { opacity: 0; transform: scale(.2) } 60% { opacity: 1; transform: scale(1.1, .9) } 100% { opacity: .9; transform: scale(1) } }
.ring.hide5:not(.shown) { visibility: hidden }
.ballot.blade svg { width: 6vh; height: 6vh; color: #e4d4ce; filter: drop-shadow(0 0 1.4vh rgba(194,41,97,.5)) } .ballot.blade b { color: var(--blood2) }
.bladefall { display: flex; align-items: center; gap: 1.4vh; margin-top: 1.4vh; padding: 1vh 2vh; border: max(1px, .12vh) solid var(--blood); border-radius: .8vh; background: rgba(122,20,57,.35); font-family: var(--book); font-size: 3vh; color: var(--tallow); animation: dfall .9s cubic-bezier(.6,0,.9,.3) both }
.bladefall svg { width: 5vh; height: 5vh; color: #e4d4ce; flex: none } .bladefall b { color: var(--blood2) }
@keyframes dfall { 0% { opacity: 0; transform: translateY(-6vh) } 70% { opacity: 1; transform: translateY(.6vh) } 100% { transform: none } }
.award.sealed { opacity: .32; justify-content: center } .award.sealed .at { font-size: 3vh }
.award.fresh { box-shadow: 0 0 4vh rgba(230,165,140,.35); border-color: var(--brass2) }
/* the end-of-game awards */
/* awards fill a grid: 2 or 4 in two columns, 6 in three, 8 or 12 in four */
.awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6vh; width: 100%; max-width: 60vw }
.awards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 76vw } .awards.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 84vw }
.awards.mid .award { padding: 1.2vh 1vh } .awards.mid .award b { font-size: 3.8vh } .awards.mid .award small { font-size: 2.2vh }
.awards.dense { gap: 1vh } .awards.dense .award { padding: .8vh .8vh; gap: .2vh } .awards.dense .aico { font-size: 3.4vh } .awards.dense .award .at { font-size: 1.7vh } .awards.dense .award b { font-size: 3vh } .awards.dense .award small { font-size: 1.9vh }
#tv.big .awards.mid .award b { font-size: 4.2vh } #tv.big .awards.mid .award small { font-size: 2.4vh } #tv.big .awards.dense .award .at { font-size: 1.9vh } #tv.big .awards.dense .award b { font-size: 3.3vh } #tv.big .awards.dense .award small { font-size: 2vh }
.award { display: flex; flex-direction: column; align-items: center; gap: .5vh; padding: 1.6vh 1.4vh; text-align: center; background: rgba(9,7,10,.62); border: max(1px, .12vh) solid rgba(174,98,73,.45); border-radius: .8vh }
.award .aico { font-size: 5vh; color: var(--brass2) } .award .at { font-family: var(--sc); font-weight: 700; letter-spacing: .14em; font-size: 2.1vh; color: var(--brass) }
.award b { font-family: var(--disp); font-weight: 500; font-size: 4.4vh; line-height: 1.05; color: var(--tallow); text-wrap: balance } .award small { font-family: var(--book); font-style: italic; font-size: 2.4vh; line-height: 1.2; color: var(--tallow2); text-wrap: balance }
#tv.big .award .at { font-size: 2.5vh } #tv.big .award b { font-size: 5vh } #tv.big .award small { font-size: 2.8vh }
.prizeico { font-size: 14vh; filter: drop-shadow(0 0 4vh rgba(217,109,76,.4)) }
#card .pci { font-size: 13vh; color: var(--brass2); animation: rise 1s .15s both } #card .pci .ico { stroke-width: 1.6 }
#card .pct { font-family: var(--disp); font-weight: 500; font-size: 12vh; line-height: 1; animation: title 1.4s .2s both, shimmer 2s ease-in-out .5s both }
#card .pcs { font-family: var(--sc); letter-spacing: .46em; text-indent: .46em; font-size: 2.6vh; color: var(--brass); animation: fade 1s .8s both }
#card .rule { animation: fade 1s .6s both }
#over { position: absolute; inset: 0; z-index: 9; display: none; background: #000000; align-items: center; justify-content: center; flex-direction: column; gap: 2vh; text-align: center }
#over.on { display: flex }
#flash { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0 }
#flash.red { animation: flashred 2.2s ease-out } #flash.gold { animation: flashgold 2.2s ease-out }
#flash.redlong { animation: flashredlong 4.2s ease-out } #flash.goldsoft { animation: flashgold 2.6s ease-out }
@keyframes flashredlong { 0% { opacity: .9; background: radial-gradient(circle, rgba(194,41,97,.85), rgba(122,20,57,.45)) } 18% { opacity: .35 } 30% { opacity: .7 } 100% { opacity: 0; background: radial-gradient(circle, rgba(194,41,97,.85), rgba(122,20,57,.45)) } }
/* the drumroll: the name and the held seal tremble until the host lets go */
.rolling { animation: tremble .09s linear infinite !important } .vcard.rolling { box-shadow: 0 0 3vh rgba(230,165,140,.55); border-color: var(--brass2) }
@keyframes tremble { 0% { transform: translate(0, 0) } 25% { transform: translate(-.25vh, .15vh) } 50% { transform: translate(.2vh, -.2vh) } 75% { transform: translate(-.15vh, -.1vh) } 100% { transform: translate(.2vh, .15vh) } }
.eyebrow.rollwait { color: var(--blood2) }
/* the role card: a Cloak's seal cracks; a Candle's card sits in slow gold light */
.rolecard { position: relative } .rolecard .bigseal { position: relative }
.rolecard .crack { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #ffd7e6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 .8vh rgba(234,90,143,.9)); stroke-dasharray: 120; stroke-dashoffset: 120; animation: crack .9s 2.3s both cubic-bezier(.6,.1,.2,1) }
@keyframes crack { to { stroke-dashoffset: 0 } }
.rolecard .rays { position: absolute; left: 50%; top: 50%; width: 110vh; height: 110vh; margin: -55vh 0 0 -55vh; border-radius: 50%; pointer-events: none; z-index: -1; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(230,165,140,.16) 0 6deg, transparent 6deg 18deg); -webkit-mask-image: radial-gradient(closest-side, #000000 20%, transparent 100%); mask-image: radial-gradient(closest-side, #000000 20%, transparent 100%);
  animation: raysin 1.6s 2s both ease, spin 60s linear infinite; will-change: transform }
@keyframes raysin { to { opacity: 1 } } @keyframes spin { to { transform: rotate(360deg) } }
@keyframes flashred { 0% { opacity: .85; background: radial-gradient(circle, rgba(194,41,97,.85), rgba(122,20,57,.4)) } 100% { opacity: 0; background: radial-gradient(circle, rgba(194,41,97,.85), rgba(122,20,57,.4)) } }
@keyframes flashgold { 0% { opacity: .6; background: radial-gradient(circle, rgba(230,165,140,.8), rgba(174,98,73,.25)) } 100% { opacity: 0; background: radial-gradient(circle, rgba(230,165,140,.8), rgba(174,98,73,.25)) } }
#soundbtn { position: absolute; right: 1.2vw; bottom: 1.2vh; z-index: 10; width: 4.4vh; height: 4.4vh; padding: 0; overflow: hidden; font-family: var(--sc); font-size: 1.5vh; letter-spacing: .1em; color: var(--tallow2); background: rgba(9,7,10,.6); border: max(1px, .1vh) solid rgba(174,98,73,.35); border-radius: 50%; opacity: .45 }
#soundbtn.ask { top: 9.6vh; bottom: auto; right: auto; left: calc(3.2vw + 17vh); width: auto; height: auto; padding: 1.2vh 3vh; border-radius: .4vh; font-size: 2.2vh; letter-spacing: .3em; opacity: 1; color: #170c18; background: linear-gradient(180deg, var(--brass2), var(--brass)); border-color: var(--brass2); font-weight: 700; animation: askglow 2s ease-in-out infinite }
@keyframes askglow { 50% { box-shadow: 0 0 3.4vh rgba(230,165,140,.75) } }
/* full screen: beside the sound button until the sound is on, then small in the corner; gone while full screen */
#fsbtn { position: absolute; right: calc(1.2vw + 5.6vh); bottom: 1.2vh; z-index: 10; height: 4.4vh; padding: 0 2vh; display: flex; align-items: center; gap: 1.2vh; font-family: var(--sc); font-weight: 700; font-size: 1.6vh; letter-spacing: .24em; color: var(--tallow2); background: rgba(9,7,10,.6); border: max(1px, .1vh) solid rgba(174,98,73,.35); border-radius: 2.2vh; opacity: .55; cursor: pointer; transition: opacity .4s }
#fsbtn small { font-weight: 500; letter-spacing: .12em; opacity: .7 }
#fsbtn.withsound { top: 16.2vh; bottom: auto; right: auto; left: calc(3.2vw + 17vh); height: auto; padding: 1.1vh 3vh; border-radius: .4vh; font-size: 2.1vh; opacity: 1; color: var(--brass2); border-color: var(--brass2); background: rgba(9,7,10,.75) }
#fsbtn.off { display: none }
body.nocursor #fsbtn:not(.withsound) { opacity: 0; pointer-events: none }

/* Larger TV text (the default; the host's Menu switches back to standard). Headlines grow a little, reading text a lot. */

#tv.big .rules { font-size: 4.6vh; max-width: 74vw }
#tv.big .tag { font-size: 2.8vh }
#tv.big .q { font-size: 7vh; max-width: 74vw } #tv.big .a { font-size: 10.2vh } .a.long { font-size: 6.6vh; max-width: 80vw } #tv.big .a.long { font-size: 7.4vh }

#tv.big .rtcopy .rtag { font-size: 2.3vh }
#tv.big .ballot span { font-size: 3.7vh } #tv.big .ballot b { font-size: 8.2vh }
#tv.big .rolecard .word { font-size: 8.6vh } #tv.big .rolecard .who { font-size: 3vh }
#tv.big .vcard .vn { font-size: 2.7vh } #tv.big .vcard .vword { font-size: 3vh } #tv.big .votecards.few .vword { font-size: 3.9vh } #tv.big .votecards.many .vn, #tv.big .votecards.many .vword { font-size: 2vh } #tv.big .votecards.mid .vn { font-size: 2.2vh } #tv.big .votecards.mid .vword { font-size: 2.6vh }
#tv.big .rolls b { font-size: 2.8vh } #tv.big .rolls small { font-size: 2.6vh } #tv.big .rolls.many b { font-size: 2.4vh } #tv.big .rolls.many small { font-size: 2.3vh }
/* the last screen with eleven or more players is the fullest there is: its lines stay close to standard size */
#tv.big #stage:has(.rolls.many) h1 { font-size: 9vh } #tv.big #stage:has(.rolls.many) .sub { font-size: 3.3vh } #tv.big #stage:has(.rolls.many) .sub.small { font-size: 2.4vh }
#tv.big #stage:has(.rolls.many) .prizeline b { font-size: 5.6vh } #tv.big #stage:has(.rolls.many) .prizeline em { font-size: 3vh } #tv.big #stage:has(.rolls.many) .prizeline span { font-size: 2.4vh } #tv.big .votecards ~ .sub { font-size: 3.8vh }
#tv.big .rulelist { font-size: 3.15vh; gap: 1.1vh 3.4vw } #tv.big .rulelist.ghostrules { font-size: 3.8vh }
#tv.big .quizpart { font-size: 2.6vh }
#tv.big .nightwho { font-size: 4vh } #tv.big .nighttext { font-size: 7.2vh; max-width: 80vw } #tv.big .nighttext.short { font-size: 12.5vh } #tv.big .nighttext.mid { font-size: 9vh } #tv.big .nighttext.long { font-size: 6vh } #tv.big .nightn { font-size: 2.5vh }
#tv.big #card .pcs { font-size: 3.2vh }
#tv.big .prizeline span { font-size: 2.8vh } #tv.big .prizeline b { font-size: 6.2vh } #tv.big .prizeline em { font-size: 3.5vh }
#tv.big .hint { font-size: 2.4vh }
#tv.big .rtcopy h1 { font-size: min(10.6vh, 6vw) } /* the Reckoning's copy column is narrow: on a 16:10 or 4:3 screen the headline shrinks with it */
@media (max-aspect-ratio: 17/10) { #tv.big .votecards.few .vcard .vseal { width: 10vh; height: 10vh } #stage:has(.rolls.many) .sub.small { font-size: 2.2vh } }
/* a 16:10 screen (a MacBook) is taller for its width: a crowded final roll goes five across, three rows instead of four */
@media (max-aspect-ratio: 17/10) and (min-aspect-ratio: 3/2) { .rolls.many { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; max-width: calc(100vw - 6.4vw - 24vh); gap: 1vh 1.2vh }
  .rolls.many > div { gap: .8vh; padding: .8vh .9vh } .rolls.many .seal { width: 5vh; height: 5vh } #tv .rolls.many b { font-size: 2.1vh; overflow-wrap: anywhere } #tv .rolls.many small { font-size: 2vh } }
@media (max-aspect-ratio: 17/10) { #tv.big .rulelist { font-size: 2.85vh } #tv.big .rtcopy .sub { font-size: 3.5vh } #tv.big .rtcopy .rtag { font-size: 1.9vh } #tv.big .rtcopy .eyebrow { font-size: 2.5vh } }
@media (max-aspect-ratio: 3/2) { #tv.big .rulelist { font-size: 2.6vh } #tv.big .sub, #tv.big .rules, #tv.big .q { max-width: 80vw } #tv.big .q { font-size: 5.8vh } #tv.big .a { font-size: 8.6vh } #tv.big .a.long { font-size: 6vh } #tv.big .hilo b { font-size: 8.6vh } }
#net { position: absolute; left: 50%; bottom: 1.4vh; transform: translateX(-50%); z-index: 10; padding: .7vh 2vh; font-family: var(--sc); font-size: 1.8vh; letter-spacing: .3em; color: var(--blood2); background: rgba(9,7,10,.8); border: max(1px, .1vh) solid rgba(194,41,97,.6); border-radius: .4vh; display: none } #net.on { display: block; animation: pulse 1.6s ease-in-out infinite }
body.nocursor, body.nocursor * { cursor: none !important }
.stamp { position: absolute; left: 1.2vw; bottom: 1vh; z-index: 10; font-family: var(--ui); font-size: max(11px, 1.1vh); letter-spacing: .08em; color: rgba(232,208,200,.28) }

function banter(s,kind){
  const r=s.round||1,pick=a=>a[r%a.length];
  if(kind==="margin"){const m=s.table&&s.table.margin;return m&&BANTER[m]?pick(BANTER[m]):""}
  const log=s.voteLog||[],last=log[log.length-1];if(!last)return"";
  if(last.role==="cloak")return pick(log.filter(x=>x.role==="cloak").length===1?BANTER.cloakFirst:BANTER.cloak);
  let n=0;for(let i=log.length-1;i>=0&&log[i].role!=="cloak";i--)n++;

}
