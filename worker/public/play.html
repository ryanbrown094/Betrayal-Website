      ctl = `<p class="step-head">Part ${part} of 3 · ${["Easy", "Medium", "Brutal"][part - 1] || ""} · question ${(m.qn - 1) % per + 1} of ${per}</p>${mysteryNote(m, m.qn, "gets this right")}<p class="note">Q: ${esc(q[0])}<br>A: ${gold(q[1])}</p>${m.showA ? `<p class="note">${sh ? esc(sh.name) + (m.lastRight ? " correct" : " wrong") : "Nobody"}. Next in a moment…</p><div class="row"><button onclick="quizNext()">Next now</button></div>` : sh ? `<div class="row"><button class="good" onclick="quizJudge(true)">${esc(sh.name)} — Correct</button><button class="danger" onclick="quizJudge(false)">${esc(sh.name)} — Wrong</button></div><div class="row"><button class="ghost slim" onclick="act(s=>{s.mission.shouter=null})">Unpick</button></div>` : `<p class="note">Tap the first to shout.</p>` + grid(p => `act(s=>{s.mission.shouter='${p.id}'})`) + `<div class="row"><button onclick="quizJudge(null)">Nobody — reveal and move on</button></div>`}<h3>scores</h3>${scoreRows(m)}${doneBtn}`;
    }
    else if (m.key === "estimate") { const q = itemOf(m); ctl = `<p class="step-head">Round ${m.qn} of ${m.total}</p>${mysteryNote(m, m.qn, "is closest")}<p class="note">Q: ${esc(q[0])}<br>A: ${gold(Number(q[1]).toLocaleString("en-GB"))}</p>${m.showA ? `<h3>tap the closest — scores and moves on</h3>${grid(p => `award('${p.id}')`)}<div class="row"><button onclick="award(null)">Nobody — next</button></div>` : `<p class="note">Boards up, then reveal.</p><div class="row"><button class="primary" onclick="act(s=>{s.mission.showA=true})">Reveal the answer on TV</button></div>`}<h3>scores</h3>${scoreRows(m)}${doneBtn}` }
    else if (m.key === "likely") { ctl = `<p class="step-head">Prompt ${m.qn} of ${m.total}</p><p class="note">“${esc(itemOf(m))}”. Boards up: tap + next to each name as it is chalked.</p>${alive().map(p => `<div class="vote"><span>${ART.seal(p)}${esc(p.name)}</span><button onclick="act(s=>{const t=s.mission.tally;t['${p.id}']=Math.max(0,(t['${p.id}']||0)-1)})">−</button><b class="n num">${m.tally[p.id] || 0}</b><button onclick="act(s=>{const t=s.mission.tally;t['${p.id}']=(t['${p.id}']||0)+1})">+</button></div>`).join("")}<div class="row">${m.showA ? `<button class="primary" onclick="likelyNext()">${m.qn >= m.total ? "Finish" : "Next prompt"}</button>` : `<button class="primary" onclick="act(s=>{s.mission.showA=true})">Reveal the verdict</button>`}</div>${doneBtn}` }
    else if (m.key === "memory") {
      const shown = m.timerEnd || m.showA;
      ctl = !shown ? `<p class="note">Chalkboards face down. The wall shows for ${m.timer} s.</p><div class="row"><button class="primary" onclick="act(s=>{const m=s.mission;m.timerDur=m.timer*1000;m.timerEnd=now()+m.timerDur;m.showA=false})">Show the wall — ${m.timer} s</button></div>` : `<div class="row"><button class="${m.showA ? "" : "primary"}" onclick="act(s=>{s.mission.timerEnd=null;s.mission.showA=true})" ${m.showA ? "disabled" : ""}>Show the answers</button><button class="ghost" onclick="act(s=>{const m=s.mission;m.timerDur=m.timer*1000;m.timerEnd=now()+m.timerDur;m.showA=false})">Show the wall again</button></div><h3>correct per player (type)</h3>${alive().map(p => `<div class="vote"><span>${ART.seal(p)}${esc(p.name)}</span><input type="number" inputmode="numeric" min="0" max="25" aria-label="${esc(p.name)} correct" value="${m.scores[p.id] || 0}" onchange="const v=Math.max(0,Math.min(25,Math.round(+this.value||0)));act(s=>{s.mission.scores['${p.id}']=v})"></div>`).join("")}${doneBtn}`;
    }
    else if (m.key === "dilemma") { ctl = m.result ? `<p class="note">${m.result.kind === "one" ? esc(m.result.name) + " takes the shield." : m.result.kind === "none" ? "Nobody wrote SHIELD." : m.result.count + " wrote SHIELD — no shield."}</p><div class="foot"><button class="primary" onclick="act(s=>finishPlay(s))">Continue</button></div>` : `<p class="note">Turn the boards. Tap everyone who wrote SHIELD, then resolve.</p><div class="plist">${alive().map(p => pbtn(p, m.picks.includes(p.id) ? "sel" : "", "togglePick('" + p.id + "')")).join("")}</div><div class="foot"><button class="primary" onclick="resolveDilemma()">Resolve — ${m.picks.length} wrote SHIELD</button></div>` }
    else if (m.key === "charades" || m.key === "hum" || m.key === "draw") {
      // one step at a time: pick the performer, show them the word, run the clock, then who guessed
      const word = itemOf(m), ghosts = ghostsOf(s), hum = m.key === "hum", drw = m.key === "draw", a = m.actorId ? P(m.actorId) : null, noun = hum ? "song" : drw ? "picture" : "scene", role = hum ? "hummer" : drw ? "artist" : "actor";
      const pickA = id => `act(s=>{const m=s.mission;m.actorId='${id}';m.showA=false;m.wordOn=false;m.bfOff=false;m.timerEnd=null})`;
      const skip = `<button onclick="skipWord()">Skip — ${a ? esc(a.name) : "they"} doesn’t know it · new ${noun}</button>`;
      if (!a) ctl = `<p class="step-head">1 · Who’s the ${role}?</p><p class="note">A Ghost if you have one — they love this bit.</p>${ghosts.length ? `<div class="plist">${ghosts.map(p => pbtn(p, "", pickA(p.id), "ghost")).join("")}</div>` : ""}<div class="plist">${alive().map(p => pbtn(p, "", pickA(p.id))).join("")}</div>`;
      else if (!m.showA && !m.timerEnd) ctl = `<p class="step-head">2 · Blindfolds on</p><p class="note">The TV tells everyone except ${esc(a.name)}: blindfolds on. Nothing else shows yet. ${cap1(noun)}: ${gold(word)}</p><div class="row"><button class="primary" onclick="act(s=>{s.mission.showA=true;s.mission.wordOn=false;s.mission.timerEnd=null})">Blindfolds on — everyone but ${esc(a.name)}</button></div><div class="row"><button class="ghost" onclick="act(s=>{s.mission.actorId=null})">Different ${role}</button></div>`;
      else if (!m.wordOn && !m.timerEnd) ctl = `<p class="step-head">3 · Show ${esc(a.name)} the ${noun}</p><p class="note">Check every blindfold is on. Then the ${noun} goes up for ${esc(a.name)} alone. ${cap1(noun)}: ${gold(word)}</p><div class="row"><button class="primary" onclick="act(s=>{s.mission.wordOn=true})">Blindfolds are on — show ${esc(a.name)}</button></div><div class="row"><button class="ghost" onclick="act(s=>{s.mission.showA=false})">Back</button></div>`;
      else if (!m.timerEnd && hum && m.bfOff) ctl = `<p class="step-head">5 · Start the clock</p><p class="note">Blindfolds are off. Song: ${gold(word)}. The music goes quiet for the ${m.timer} s and the TV shows the clock only for the last five.</p><div class="row"><button class="primary" onclick="act(s=>{const m=s.mission;m.timerDur=m.timer*1000;m.timerEnd=now()+m.timerDur})">Start ${m.timer} s — ${esc(a.name)} hums</button></div><div class="row">${skip}</div>`;
      else if (!m.timerEnd && hum) ctl = `<p class="step-head">4 · ${esc(a.name)} is reading it</p><p class="note">Song: ${gold(word)}. When they nod, blindfolds off — then you start the clock.</p><div class="row"><button class="primary" onclick="act(s=>{s.mission.bfOff=true})">Blindfolds off</button></div><div class="row">${skip}</div>`;
      else if (!m.timerEnd) ctl = `<p class="step-head">4 · ${esc(a.name)} is reading it</p><p class="note">${cap1(noun)}: ${gold(word)}. When they nod: blindfolds off, clock on.${drw ? " Chalk and board in hand." : ""}</p><div class="row"><button class="primary" onclick="act(s=>{const m=s.mission;m.timerDur=m.timer*1000;m.timerEnd=now()+m.timerDur})">Blindfolds off — start ${m.timer} s</button></div><div class="row">${skip}</div>`;
      else ctl = `<p class="step-head">5 · Who guessed it?</p><p class="note">${cap1(noun)}: ${gold(word)}. Guesser and ${role} both score.</p>${grid(p => `guessed('${p.id}')`, p => p.id === a.id ? role : "")}<div class="row"><button onclick="act(s=>{const m=s.mission;nextItem(s);m.actorId=null;m.showA=false;m.wordOn=false;m.bfOff=false;m.timerEnd=null})">Nobody got it — next ${role}</button></div><div class="row">${skip}</div>`;
      ctl += `<h3>scores</h3>${scoreRows(m)}${doneBtn}`;
    }
    else if (m.key === "hilo") {
      const q = itemOf(m), st = m.standing.map(id => P(id)).filter(Boolean), hi = q[1] > m.ref;
      if (m.won) {
        ctl = `<p class="step-head">Round ${m.won.n} of ${m.total} · won</p><p class="note">${m.won.name ? "<b>" + esc(m.won.name) + "</b> wins round " + m.won.n + " — on the TV now." : "Round " + m.won.n + " is over."}</p><h3>round wins</h3>${scoreRows(m)}${doneBtn}`;
        foot = `<button class="primary" onclick="hiloRound()">${m.qn >= m.total ? "Finish the mission" : "Round " + (m.qn + 1) + " — everyone stands"}</button>`;
        return { body: `<h2>${esc(m.title)}</h2>${ctl}`, foot };
      }
      ctl = `<p class="step-head">Round ${m.qn} of ${m.total} · ${st.length} standing</p>${mysteryNote(m, m.qn, "is last one standing")}<p class="note">Q: ${esc(q[0])}<br>Higher or lower than ${gold(Number(m.ref).toLocaleString("en-GB"))}? Answer: ${gold(Number(q[1]).toLocaleString("en-GB"))} — <b>${hi ? "HIGHER" : "LOWER"}</b></p>${m.showA ? `<h3>tap everyone who got it wrong — they sit</h3><div class="plist">${st.map(p => pbtn(p, m.out.includes(p.id) ? "sel" : "", "hiloOut('" + p.id + "')", m.out.includes(p.id) ? "out" : "")).join("")}</div><p class="note">${m.out.length && m.out.length === st.length ? "All wrong — nobody sits this time." : st.length - m.out.length === 1 ? "That leaves one: they win the round." : ""}</p>` : `<p class="note">“Thumbs up for higher, down for lower… three, two, one.”</p><div class="row"><button class="primary" onclick="act(s=>{s.mission.showA=true})">Reveal the answer on TV</button></div>`}<h3>round wins</h3>${scoreRows(m)}${doneBtn}`;
      foot = m.showA ? `<button class="primary" onclick="hiloNext()">${st.length - m.out.length <= 1 && m.out.length < st.length ? "Round won — show the winner" : "Next question"}</button>` : "";
    }
    else if (m.key === "truths") {
      const t = m.tellerId ? P(m.tellerId) : null, pool = [...alive(), ...ghostsOf(s)].filter(p => !m.done2.includes(p.id)), last = m.lastResult;
      if (!t) ctl = `<p class="step-head">Turn ${m.qn} of ${m.total} · who’s up?</p>${last ? `<p class="note">${esc(last.name)} fooled ${plural(last.fooled, "player")}; ${last.right} saw through it.</p>` : ""}<div class="row"><button class="primary" onclick="truthsPick(null)">Pick someone at random</button></div><div class="plist">${pool.map(p => pbtn(p, "", "truthsPick('" + p.id + "')", p.alive ? "" : "ghost")).join("")}</div>`;
      else if (m.tstage === "think") ctl = `<p class="step-head">Turn ${m.qn} of ${m.total} · ${esc(t.name)}</p><p class="note">${esc(t.name)} thinks of two truths and a lie${m.timerEnd ? " — the clock is running" : ""}. Everyone gets their chalk ready.</p><div class="row">${m.timerEnd ? "" : `<button onclick="truthsGo('think')">Give them ${m.timer} s to think</button>`}<button class="primary" onclick="truthsGo('tell')">They’re ready — three statements</button></div><div class="row"><button class="ghost" onclick="act(s=>{s.mission.tellerId=null;s.mission.tstage=null;s.mission.timerEnd=null})">Someone else</button></div>`;
      else ctl = `<p class="step-head">Turn ${m.qn} of ${m.total} · ${esc(t.name)}</p><p class="note">Three statements, then everyone chalks 1, 2 or 3. Boards up — ${esc(t.name)} reveals the lie.</p><h3>tap everyone who spotted the lie</h3><div class="plist">${alive().filter(p => p.id !== t.id).map(p => pbtn(p, m.right.includes(p.id) ? "sel" : "", "truthsRight('" + p.id + "')", m.right.includes(p.id) ? "✓" : "")).join("")}</div>`;
      ctl += `<h3>scores</h3>${scoreRows(m)}${doneBtn}`;
      if (t && m.tstage === "tell") foot = `<button class="primary" onclick="truthsScore()">Score it — ${m.right.length} right, ${Math.max(0, alive().filter(p => p.id !== t.id).length - m.right.length)} fooled</button>`;
    }
    else if (m.key === "change") {
      const at = i => `${i + 1} (${m.before ? m.before[i] : ""} → ${m.grid ? m.grid[i] : ""})`;
      const mys = mysteryNote(m, m.qn, "spots it first");
      if (!m.cstage) ctl = `<p class="step-head">Round ${m.qn} of ${m.total}</p>${mys}<p class="note">${m.qn <= Math.ceil(m.total / 2) ? "This round one symbol is swapped for a new one." : "This round two symbols trade places."}</p><div class="row"><button class="primary" onclick="changeStudy()">Show the grid — ${m.timer} s to study</button></div>`;
      else if (m.cstage === "study") ctl = `<p class="step-head">Round ${m.qn} of ${m.total} · studying</p>${mys}<p class="note">When the clock runs out the grid hides by itself: the TV counts down ten seconds, then shows the changed grid. Nothing to tap.</p><div class="row"><button class="ghost" onclick="changeBlind()">Hide it now</button></div>`;
      else ctl = `<p class="step-head">Round ${m.qn} of ${m.total} · ${m.cstage === "blind" ? "ten-second countdown, then" : ""} first to shout</p>${mys}<p class="note">Changed: ${m.changed.map(at).join(" and ")}. Positions count left to right, top row first.${m.cstage === "blind" ? " The new grid appears when the TV’s countdown ends." : ""}</p>${m.cstage === "blind" && !m.showA ? `<div class="row"><button class="ghost" onclick="changeLook()">Show the new grid now</button></div>` : ""}${m.showA ? `<p class="note">${m.spotter ? esc(m.spotter) + " spotted it." : "Nobody spotted it."} The TV shows the change.</p>` : `<h3>who spotted it?</h3>${grid(p => `changeAward('${p.id}')`)}<div class="row"><button onclick="changeAward(null)">Nobody — show the change</button></div><h3>wrong shouts — tap each one</h3>${grid(p => `changeWrong('${p.id}')`, p => (m.wrongs || {})[p.id] ? "✗" + (m.wrongs[p.id] > 1 ? m.wrongs[p.id] : "") : "")}<p class="note">${state.wrongRule === "all" ? "Every wrong shout costs the pot; a Cloak’s double." : "A Cloak’s wrong shout costs the pot; a Candle’s costs nothing."} The TV shows only the total at the end.</p>`}`;
      ctl += `<h3>scores</h3>${scoreRows(m)}${doneBtn}`;
      if (m.showA) foot = nextBtn(m.qn >= m.total ? "Finish" : "Next round", "changeNext()");
    }
    else if (m.key === "snap") { ctl = `<p class="note">${m.total} symbols, one every 5 seconds. Tap + for a correct SNAP, − for a false one (${state.wrongRule === "all" ? "every false SNAP costs the pot, a Cloak’s double" : "a Cloak’s false SNAP costs the pot"}).</p><div class="row"><button class="primary" onclick="act(s=>{s.mission.seq=snapSeq(s.mission.total);s.mission.seqStart=now()+5000})">${m.seqStart ? "Restart sequence" : "Start sequence"}</button>${m.seqStart ? `<button onclick="act(s=>{s.mission.seqStart=null})">Stop</button>` : ""}</div>${scoreRows(m)}${doneBtn}` }
    else if (m.key === "countdown") {
      const best = bestWords(m.letters); if (!DICT && !dictFail && !dictP) loadDict().then(() => { if (isHost) renderHost() });
      ctl = `<p class="step-head">Round ${m.qn} of ${m.total}</p><div class="lettersrow">${esc(m.letters)}</div>${mysteryNote(m, m.qn, "has the longest word")}<p class="note">The ${m.timer} s clock started with the letters. Longest possible: ${best ? (best.length ? best.map(w => w.toUpperCase() + " (" + w.length + ")").join(", ") : "nothing over two letters") : dictFail ? "dictionary unavailable — judge by ear" : "loading dictionary…"}</p><div class="row"><button class="ghost" onclick="act(s=>{const m=s.mission;m.timerDur=m.timer*1000;m.timerEnd=now()+m.timerDur})">Restart clock</button><button class="ghost" onclick="act(s=>{s.mission.timerEnd=null})">Stop clock</button></div><h3>round winner (longest word) — deals the next round</h3>${grid(p => `awardWord('${p.id}')`)}<div class="row"><button onclick="awardWord(null)">No winner — next round</button></div><h3>round wins so far</h3>${scoreRows(m)}${doneBtn}`;
    }
    else { const run = m.timerEnd && m.timerEnd > now(); ctl = `<div class="row"><button class="${run ? "" : "primary"}" onclick="act(s=>{const m=s.mission;m.timerDur=m.timer*1000;m.timerEnd=now()+m.timerDur})" ${m.timer ? "" : "disabled"}>${run ? "Running on TV — restart" : m.timer ? "Start " + mmss(m.timer) + " timer" : "No timer"}</button><button onclick="act(s=>{s.mission.timerEnd=null})">Stop</button></div><div class="row"><button onclick="act(s=>{s.mission.timer=Math.max(10,s.mission.timer-30)})">−30 s</button><button onclick="act(s=>{s.mission.timer+=30})">+30 s</button></div><h3>points (3 / 2 / 1 for places, or tap the winner once)</h3>${scoreRows(m)}${doneBtn}` }
  }
  return { body: `<h2>${esc(m.title)}</h2>${ctl}`, foot };
}

/* ---- the Reckoning: talk, then every board in seat order, then the exile ---- */
// the name goes into the sheet from the state, never through an onclick string (an apostrophe in a name broke it)
function askLay() { const id = championArmed(state), p = id && P(id); if (p) confirmSheet(p.name + " lays down shield and blade?", "Nobody may chalk their name at this table. Their vote counts once, and nothing protects them tonight. Undo brings it back.", "Lay them down", championImmunity, "primary") }
function tableHost(s) {
  const t = s.table, stage = t.stage || "votes", A = alive(), v = t.votes || {}, imm = t.immune || [], ballots = t.ballots || {}, w = championOf(s), wp = w ? P(w) : null;
  const nIn = A.filter(p => p.id in ballots).length, wa = championArmed(s), wap = wa && P(wa);
  // only the Champion (shield and blade) may lay both down, and only before the first board
  const layBtn = wap && stage !== "exile" && !nIn ? `<div class="row"><button onclick="askLay()">⚔ ${esc(wap.name)} lays down shield and blade — immune</button></div>` : "";
  const laid = t.laid && P(t.laid), sec = !!(wp && s.champion && s.champion.secret), dg = t.blade && P(t.blade.to);
  const notes = (wp ? `<p class="note">⚔ ${wa ? "Champion" : "Blade"}${sec ? " — won in secret" : ""}: <b>${esc(wp.name)}</b>. Their board counts one as it turns, like everyone’s. Once every board is in, the blade adds one more vote to whoever they chalked — the TV shows where it fell${sec ? ", never whose it was. Don’t give them away" : ""}.${wa ? " They hold a shield too." : ""}</p>${dg ? `<p class="note">⚔ The blade fell on <b>${esc(dg.name)}</b>: +1, counted below.</p>` : ""}` : "") + (laid ? say(SAY.championLaid(laid.name, s.round)) + `<p class="note">⛨ Can’t be voted for at this table: <b>${esc(laid.name)}</b>. Shield and blade are gone — their vote counts once, and nothing protects them tonight.</p>` : "");
  if (stage === "talk") {
    const dflt = (t.second ? 6 : Math.min(A.length, 16)) * 30000, dur = t.talkDur || dflt;
    const talk = t.talkEnd ? `<div class="row"><button onclick="act(s=>{s.table.talkEnd=null})">Stop the talk timer</button></div>` : `<div class="row"><button onclick="act(s=>{s.table.talkDur=Math.max(30000,(s.table.talkDur||${dflt})-30000)})">−30 s</button><button class="primary" onclick="act(s=>{s.table.talkDur=s.table.talkDur||${dflt};s.table.talkEnd=now()+s.table.talkDur})">Start ${mmss(dur / 1000)} talk</button><button onclick="act(s=>{s.table.talkDur=(s.table.talkDur||${dflt})+30000})">+30 s</button></div>`;
    return { body: `<h2>Reckoning${t.second ? " — second vote" : ""}</h2><p class="step-head">1 · Table talk</p>${t.second ? `<div class="advice"><b>The second vote.</b> ${A.length + 1} sat down tonight — more than sixteen — so the house takes two. ${esc((P(t.firstExiled) || {}).name || "The first")} is gone; the boards go up again. The blade has already fallen: every board counts once.</div>` : t.exiles === 2 ? `<div class="advice"><b>Two votes tonight.</b> More than sixteen at the table: after this exile and its reveal, the boards go up again.</div>` : ""}${questBox(s, "Cloak side-quest still open:")}${say(SAY.talk(s.round) + (wap ? (sec ? SAY.talkChampionSecret : SAY.talkChampion(wap.name)) : wp ? (sec ? SAY.talkBladeSecret : SAY.talkBlade(wp.name)) : ""))}${talk}${notes}${layBtn}`, foot: nextBtn("Talk’s over — chalk a name", "act(s=>{s.table.stage='votes';s.table.talkEnd=null})") };
  }
  if (stage === "votes") {
    if (ballotEdit && !(P(ballotEdit) && P(ballotEdit).alive)) ballotEdit = null;
    const rv = (t.revote || []).map(id => P(id)).filter(Boolean), rvNames = rv.map(p => p.name).join(" and ");
    const cur = ballotEdit ? P(ballotEdit) : nextVoter(s), targets = cur ? A.filter(p => p.id !== cur.id && !imm.includes(p.id) && (!t.revote || t.revote.includes(p.id))) : [];
    const entry = cur ? `<p class="ask">${esc(cur.name)}${cur.id === w ? " ⚔ (the blade — its extra vote lands when every board is in)" : ""} chalked…</p><div class="plist">${targets.map(p => pbtn(p, ballots[cur.id] === p.id ? "sel" : "", "ballotEdit=null;castBallot('" + cur.id + "','" + p.id + "')", v[p.id] ? String(v[p.id]) : "")).join("")}</div><div class="row"><button class="ghost" onclick="ballotEdit=null;castBallot('${cur.id}','blank')">Blank or spoilt board</button>${ballotEdit ? `<button class="ghost" onclick="ballotEdit=null;renderHost()">Cancel change</button>` : ""}</div>` : `<p class="note">Every board is in.</p>`;
    const ranked = A.filter(p => v[p.id]).sort((a, b) => v[b.id] - v[a.id]);
    const tallyRows = ranked.map(p => `<div class="vote"><span>${ART.seal(p)}${esc(p.name)}</span><b class="n num">${v[p.id]}</b></div>`).join("") || `<p class="note">No votes yet.</p>`;
    const done = A.filter(p => p.id in ballots).map(p => { const tg = ballots[p.id], tp = tg !== "blank" && P(tg); return `<div class="vote"><span>${ART.seal(p)}${esc(p.name)} → ${tp ? esc(tp.name) : "blank"}${p.id === w ? " ⚔" : ""}</span><button class="wide" onclick="ballotEdit='${p.id}';renderHost()">Change</button></div>` }).join("");
    const nudge = !rv.length || nIn ? tableNudge(s) : null;
    return { body: `<h2>Reckoning</h2><p class="step-head">${rv.length ? "Revote between " + esc(rvNames) : "2 · The boards"} — ${nIn} of ${A.length} in</p>${nIn ? "" : say(rv.length ? SAY.revote(rvNames) : SAY.table(s.round))}${notes}${layBtn}${nudge ? `<div class="say nudge">${esc(nudge)}</div>` : ""}${entry}<h3>tally</h3>${tallyRows}<div class="row"><button class="${t.showDots ? "sel" : ""}" onclick="act(s=>{s.table.showDots=!s.table.showDots})">${t.showDots ? "Tally shown on TV" : "Show tally on TV"}</button>${nIn ? `<button onclick="ballotEdit=null;clearBallots()">Clear all — revote</button>` : ""}</div>${done ? `<h3>boards so far</h3>${done}` : ""}`,
      foot: backBtn("act(s=>{s.table.stage='talk'})") + `<button class="primary" onclick="ballotEdit=null;toExile()" ${nIn === A.length ? "" : "disabled"}>${nIn === A.length ? "All boards in — the exile" : (A.length - nIn) + " still to record"}</button>` };
  }
  const cand = A.filter(p => !imm.includes(p.id)), max = Math.max(0, ...cand.map(p => v[p.id] || 0)), lead = cand.filter(p => (v[p.id] || 0) === max && max > 0);
  return { body: `<h2>Reckoning</h2><p class="step-head">3 · The exile</p>${lead.length > 1 && t.revote ? say(SAY.stillTied(andList(lead.map(p => p.name)))) + `<p class="note">Still tied after the revote. When the rest agree a name — or you decide — tap it below.</p>` : ""}${lead.length > 1 ? `<div class="secret"><b>Tie:</b> ${esc(andList(lead.map(p => p.name)))} on ${max}. Revote between them, or pick one below.<div class="row"><button class="primary" onclick="ballotEdit=null;revoteTied()">Revote between ${esc(lead.map(p => p.name).join(" and "))}</button></div></div>` : lead.length ? `<p class="note">Most votes: <b>${esc(lead[0].name)}</b> (${max}).</p>` : `<p class="note">Not one name was chalked. Revote, or tap a name if the table agrees on one.</p>`}<div class="plist">${cand.map(p => pbtn(p, lead.length === 1 && lead[0].id === p.id ? "sel" : "", "exile('" + p.id + "')", (p.role === "cloak" ? "T · " : "") + (v[p.id] || 0))).join("")}</div>`, foot: backBtn("toVotes()") + `<button class="ghost" onclick="ballotEdit=null;revoteAll()">Revote — everyone</button>` };
}
function seatSheet(s) {
  if (!seatOpen) return "";
  const ps = seated(s);
  return `<div class="sheet"><div class="sheethead"><h2>Seating order</h2><button class="primary slim" onclick="seatOpen=false;renderHost()">Done</button></div><p class="note">Clockwise round the table. The TV’s Reckoning and candles follow this order, and votes are taken in it.</p>${ps.map((p, i) => `<div class="vote"><span>${ART.seal(p)}${i + 1}. ${esc(p.name)}${p.alive ? "" : " ✝"}</span><button onclick="moveSeat('${p.id}',-1)" ${i ? "" : "disabled"} aria-label="Move up">↑</button><button onclick="moveSeat('${p.id}',1)" ${i < ps.length - 1 ? "" : "disabled"} aria-label="Move down">↓</button></div>`).join("")}<button class="primary" onclick="seatOpen=false;renderHost()">Done</button></div>`;
}


/* ---- night ---- */
function nightHost(s) {
  const n = s.night, script = nightScript(n, s), step = Math.min(n.step, script.length - 1);
  if (!n.confirmed) {
    return `<h2>Night ${s.round}</h2><p class="note">TV shows a holding card. Nothing starts until you confirm.</p>${advicePanel()}<h3>tonight, by your plan</h3>${Object.keys(MODES).filter(k => modeOn(s, k)).length > 1 ? `<div class="row">${Object.keys(MODES).filter(k => modeOn(s, k) || n.mode === k).map(k => `<button class="${n.mode === k ? "sel" : ""}" onclick="act(s=>{s.night.mode='${k}';s.night.answer=null})">${modeLabel(k, s)}</button>`).join("")}</div>` : ""}<div class="advice offer"><b>${modeLabel(n.mode, s)}:</b> ${esc(n.mode === "murder" && killOf(s) === "murder" ? "Cloaks choose a Candle to murder. You tap them; they read the screen and leave the table in silence while everyone is blindfolded. A shield blocks it: tap nobody, and every chair is full at dawn. The normal night." : kw(MODES[n.mode].desc))}</div>${killsOf(n) > 1 ? `<div class="advice"><b>${cap1(numWord(killsOf(n)))} victims tonight.</b> ${alive().length} at the table: the Cloaks point once for each, one pass at a time, so the evening still reaches the final.</div>` : ""}${(n.questOpts || []).length ? `<h3>side-quest</h3><p class="note">One is chosen for tonight — tap another to change it. ‹a Candle› is named when they read it — never tonight’s victim.</p><div class="mlist">${n.questOpts.filter(o => !o.poison || n.mode === "murder").map(o => `<button class="${n.quest === o.text ? "sel" : ""}" onclick="questPick(${o.i})">${o.target ? `<em>${esc(o.target)} only</em>` : ""}<small style="font-size:15.5px;color:var(--tallow)">${esc(o.text.replace(/\{F\}/g, "‹a Candle›"))}</small></button>`).join("")}</div>${n.quest ? `<div class="row"><button onclick="act(s=>{s.night.quest=null;s.night.questTarget=null})">No quest tonight</button></div>` : ""}` : ""}`;
  }
  // each control appears on the line it belongs to: the picker while they point, the answer while they nod or shake
  const cur = norm(script[step] || {}); let pick = "", tapNote = "";
  const chosen = n.mode === "murder" ? n.victimId : n.targetId, cp = chosen ? P(chosen) : null;
  if (cur.pick && n.mode === "murder") pick = `<h3>${killsOf(n) > 1 ? "victim " + ((n.pass || 0) + 1) + " of " + killsOf(n) : "victim"} — tap as they point</h3><div class="plist">${candles().filter(p => !(n.victims || []).includes(p.id)).map(p => pbtn(p, n.victimId === p.id ? "sel" : "", "act(s=>{s.night.victimId='" + p.id + "'})", p.shield ? "⛨" : "")).join("")}</div>`;
  else if (cur.pick) pick = `<h3>target — tap as they point</h3><div class="plist">${candles().map(p => pbtn(p, n.targetId === p.id ? "sel" : "", "act(s=>{s.night.targetId='" + p.id + "';s.night.targetName=P2(s,'" + p.id + "').name;s.night.answer=null})", p.shield ? "⛨" : "")).join("")}</div>`;
  else if (cur.answer) pick = `<h3>their answer</h3><div class="row"><button class="${n.answer === "yes" ? "sel" : ""}" onclick="act(s=>{s.night.answer='yes'})" ${n.targetId ? "" : "disabled"}>Nodded — joins</button><button class="${n.answer === "no" ? "sel" : ""}" onclick="act(s=>{s.night.answer='no'})" ${n.targetId ? "" : "disabled"}>Shook — refused</button></div>`;
  else if (cp) pick = `<p class="note">${n.mode === "murder" ? "Victim" : "Target"}: <b>${esc(cp.name)}</b>${cp.shield ? " ⛨" : ""}${n.mode !== "murder" && n.answer ? " · " + (n.answer === "yes" ? "accepted" : "refused") : ""}. Go back to the pointing line to change it.</p>`;
  const vid = n.mode === "murder" ? n.victimId : n.targetId, vp = vid ? P(vid) : null;
  if (cur.tap === "victim") tapNote = `<div class="secret">${!vp ? "<b>Nobody picked yet.</b>" : vp.shield ? "<b>DO NOT TAP.</b> " + esc(vp.name) + " holds a shield. Walk the full circle at the same pace, pause behind two or three people, tap nobody." : "<b>Tap now:</b> " + esc(vp.name) + " — they read the screen, then blindfold back on. Walk the full circle either side of them."}</div>`;
  if (cur.tap === "target") tapNote = `<div class="secret"><b>Tap now:</b> ${n.targetId && P(n.targetId) ? esc(P(n.targetId).name) + " — they read the screen" : "pick the target first"}</div>`;
  if (cur.murdered) tapNote = `<div class="secret">${vp && vp.shield ? "Shielded — nobody was tapped. Wait ten seconds so the room hears nothing, then next." : (killOf(s) === "murder" ? "They read it, stand and leave the table. Keep walking the circle at the same pace until they’re clear." : "They read it and blindfold up again. Nobody leaves until dawn.")}</div>`;
  if (cur.tap === "cloaks") tapNote = `<div class="secret"><b>Tap now:</b> every Cloak — ${esc(cloaks().filter(p => p.id !== n.targetId).map(p => p.name).join(", "))}</div>`;
  if (cur.answer) tapNote = `<div class="secret"><b>Watch them.</b> Nod = accepted, shake = refused. Record below.</div>`;
  return `<h2>Night ${s.round} — ${modeLabel(n.mode, s)}${killsOf(n) > 1 ? " · " + ((n.pass || 0) + 1) + "/" + killsOf(n) : ""}</h2>${(n.victims || []).length ? `<p class="note">Already chosen tonight: ${esc(n.victims.map(id => P(id) ? P(id).name + (P(id).shield ? " ⛨" : "") : "?").join(", "))}.</p>` : ""}${stepList(script, step)}${tapNote}${pick}`;
}
function nightFoot(s) {
  const n = s.night, script = nightScript(n, s), step = Math.min(n.step, script.length - 1), cur = norm(script[step] || {}), nxt = norm(script[step + 1] || {});
  if (!n.confirmed) return `<button class="primary" onclick="beginNight()">Begin the night — ${modeLabel(n.mode, s)}</button>`;
  const back = step > 0 ? backBtn("act(s=>{s.night.step=Math.max(0," + (step - 1) + ")})") : "";
  let block = "";
  if (nxt.tap === "victim" && !(n.mode === "murder" ? n.victimId : n.targetId)) block = "Pick the victim first";
  if (cur.pick && !(n.mode === "murder" ? n.victimId : n.targetId)) block = n.mode === "murder" ? "Pick the victim first" : "Pick the target first";
  if (nxt.tap === "target" && !n.targetId) block = "Pick the target first";
  if (cur.answer && !n.answer) block = "Record their answer first";
  if (nxt.pending) block = "Record their answer first";
  if (step < script.length - 1) return back + `<button class="primary" onclick="act(s=>{s.night.step=${step + 1}})" ${block ? "disabled" : ""}>${block || "Next line"}</button>`;
  const ready = n.mode === "murder" ? !!n.victimId : !!(n.targetId && n.answer);
  if (n.mode === "murder" && (n.pass || 0) < killsOf(n) - 1) return back + `<button class="primary" onclick="nextVictim()" ${ready ? "" : "disabled"}>${ready ? "Next victim — " + numWord((n.pass || 0) + 2) + " of " + numWord(killsOf(n)) : "Pick the victim first"}</button>`;
  return back + `<button class="primary" onclick="finishNight()" ${ready ? "" : "disabled"}>${ready ? "To dawn" : "Pick the outcome first"}</button>`;
}

/* ---- the final two / share or take ---- */
function final2Host(s) {
  if (!s.final2.shown) { setTimeout(() => { if (state.final2 && !state.final2.shown) act(x => { const f = x.final2; f.shown = []; f.showRoles = false; f.cloakIds = null; aliveOf(x).forEach(p => p.revealed = false) }, "Ceremony reset — seals hidden again") }, 0); return { body: "", foot: "" } }
  const f = s.final2, A = alive(), ts = A.filter(p => p.role === "cloak"), nT = ts.length, shown = f.shown || []; let body = "", foot = "";
  const left = A.filter(p => !shown.includes(p.id));
  if (left.length) {
    // the reveal: the host turns each seal, in any order; the TV shows nothing until a name is tapped
    const nxt = left[0];
    body = `<h2>The final ${A.length === 2 ? "two" : A.length}</h2>${shown.length ? "" : say(A.length === 2 ? SAY.final2 : SAY.ceremony(A.length))}${say(SAY.ceremonyReveal)}<div class="secret"><b>Private:</b> ${nT ? plural(nT, "Cloak") + " still at the table — " + esc(ts.map(p => p.name).join(", ")) + ". The Cloaks win once every seal is turned." : "No Cloak left. The Candles win once every seal is turned."} Nothing shows on the TV until you tap a name.</div><h3>turn a seal — hold a name for the drumroll, let go to reveal</h3><div class="plist">${left.map(p => `<button class="hold" onpointerdown="holdStart('seal','${p.id}',event)" onclick="holdClick('seal','${p.id}')" oncontextmenu="return false">${ART.seal(p)}<span class="nm">${esc(p.name)}</span><span class="tagx">${p.role === "cloak" ? "C" : ""}</span></button>`).join("")}</div>${shown.length ? `<p class="note">Turned: ${esc(shown.map(id => P(id).name + " (" + (P(id).role === "cloak" ? "Cloak" : "Candle") + ")").join(", "))}.</p>` : ""}`;
    foot = holdBtn("Turn " + esc(nxt.name) + "’s seal", "seal", nxt.id, "danger");
    return { body, foot };
  }
  if (nT >= 2 && !f.order) { const done = ts.filter(p => f.votes[p.id]).length; body = `<h2>Share or Take</h2>${say(SAY.final2Cloaks)}<p class="note">Hand the phone to each Cloak in turn. ${done}/${nT} voted.</p><div class="plist">${ts.map(p => pbtn(p, f.votes[p.id] ? "dim" : "", "handoff={kind:'take',id:'" + p.id + "'};renderHost()", f.votes[p.id] ? "✓" : "")).join("")}</div>`; foot = `<button class="primary" onclick="startTakeReveal()" ${done === nT ? "" : "disabled"}>${done === nT ? "All voted — reveal on TV" : "Waiting for " + (nT - done) + " more"}</button>` }
  else if (nT >= 2) {
    const all = f.revealed >= f.order.length, st = ts.filter(p => f.votes[p.id] === "take"), g = f.ghostRound;
    body = `<h2>Share or Take</h2><p class="note">Revealing ${Math.min(f.revealed, f.order.length)}/${f.order.length}.</p>`;
    if (!all) foot = nextBtn("Reveal next", "act(s=>{s.final2.revealed++})");
    else if (st.length >= 2 && !g) {
      const gs = ghostScores(s).filter(x => x.hits);
      if (gs.length >= 2) { body += `<p class="note">They all stole. ${gs.length} Ghosts named a Cloak: ${esc(gs.map(x => x.p.name).join(", "))}. They now share or take between them.</p>`; foot = nextBtn("Ghosts’ share or take", "startGhostRound()") }
      else { body += `<p class="note">${gs.length === 1 ? esc(gs[0].p.name) + " named a Cloak from beyond the table — the prize is theirs." : "No Ghost named a Cloak. You keep the prize."}</p>`; foot = nextBtn("Show every role", "finishGame()", "danger") }
    }
    else if (g) {
      const done = g.ids.filter(id => g.votes[id]).length;
      if (!g.order) { body += `<h3>ghosts’ share or take</h3>${say(SAY.ghostTake(andList(g.ids.map(id => P(id).name))))}<p class="note">Hand the phone to each Ghost. ${done}/${g.ids.length} voted.</p><div class="plist">${g.ids.map(id => pbtn(P(id), g.votes[id] ? "dim" : "", "handoff={kind:'take',id:'" + id + "'};renderHost()", g.votes[id] ? "✓" : "")).join("")}</div>`; foot = `<button class="primary" onclick="startGhostReveal()" ${done === g.ids.length ? "" : "disabled"}>${done === g.ids.length ? "All voted — reveal on TV" : "Waiting for " + (g.ids.length - done) + " more"}</button>` }
      else foot = g.revealed < g.order.length ? nextBtn("Reveal next", "act(s=>{s.final2.ghostRound.revealed++})") : nextBtn("Show every role", "finishGame()", "danger");
    }
    else foot = nextBtn("Show every role", "finishGame()", "danger");
  }
  else { body = `<h2>${nT ? "The Cloaks win" : "The Candles win"}</h2>${say(SAY.allSealsTurned)}<p class="note">Next, the TV shows who takes the prize and every role — and you read the ending.</p>`; foot = nextBtn("Show every role", "finishGame()", "danger") }
  return { body, foot };
}
/* ===================== BOOT ===================== */
document.body.insertAdjacentHTML("afterbegin", ART.defs());
let lastHostPhase = null;
listeners.push(() => {
  if (!isHost) return renderTV();
  renderHost();
  const ph = state && authed ? state.phase + (state.mission ? state.mission.stage : "") : "-";
  if (ph !== lastHostPhase) { lastHostPhase = ph; window.scrollTo(0, 0) }
});
window.addEventListener("hashchange", () => location.reload());
if (isHost) renderHost(); else renderTV();
store.init();
// A new build reloads the page — but the TV waits for a calm phase, so a ceremony is never interrupted.
let newBuild = false;
const calm = () => !state || ["lobby", "day", "mingle", "morning", "final"].includes(state.phase);
// The phone waits too while a guest holds it for a secret vote, a sheet is open, or someone is typing (a reload would lose the setup draft).
const hostIdle = () => !handoff && !ask && !menuOpen && !(setupDraft && setupDraft.names.trim() && !(state && authed)) && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.nodeName));
if (BUILD) setInterval(async () => { try { const r = await fetch("/build.txt", { cache: "no-store" }); if (r.ok) { const b = (await r.text()).trim(); if (/^\d{14}$/.test(b) && b !== BUILD) newBuild = true } } catch (e) {} if (newBuild && (isHost ? hostIdle() : calm())) location.reload() }, 60000);
document.title = isHost ? "Host · Cloak & Candle" : "Cloak & Candle";
// keep the elapsed clock and pace advice fresh without disturbing typing or a guest holding the phone
if (isHost) setInterval(() => { const a = document.activeElement; if (state && authed && !handoff && !(a && /INPUT|TEXTAREA/.test(a.nodeName))) renderHost() }, 30000);
// What Changed?: when the study clock runs out, the grid hides by itself — the TV counts ten seconds, then shows the new one
if (isHost) setInterval(() => { const m = state && authed && state.phase === "mission" && state.mission; if (m && m.key === "change" && m.cstage === "study" && m.timerEnd && now() >= m.timerEnd && !handoff) changeBlind() }, 500);
// neither screen should fall asleep mid-ceremony
let wake = null;
async function keepAwake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null }) } } catch (e) {} }
document.addEventListener("pointerdown", keepAwake);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); if (AC && AC.state === "suspended") AC.resume() } });
</script>
