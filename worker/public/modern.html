/* The Betrayal — Modern: every phone, the director's extra controls, and the optional TV. Same palette as Classic. */
:root {
  --soot: #09070a; --peat: #130d14; --walnut: #251428; --walnut2: #341b37;
  --tallow: #e8d0c8; --tallow2: #afa198; --mist: #877e78;
  --brass: #ae6249; --brass2: #e6a58c; --brass3: #582c5f;
  --ox: #7a1439; --blood: #c22961; --blood2: #ea5a8f; --steel: #8fa3b8; --verd: #5fa88f; --verd2: #2e6b57;
  --disp: "Grenze Gotisch", "Cinzel", "Times New Roman", serif;
  --book: "IM Fell DW Pica", "Cormorant Garamond", Georgia, serif;
  --ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --sc: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
}
* { box-sizing: border-box }
html, body { margin: 0; min-height: 100%; background: var(--soot); color: var(--tallow); -webkit-text-size-adjust: 100% }
body { font-family: var(--ui); font-size: 18px; line-height: 1.4; overflow-x: hidden;
  background: radial-gradient(120% 60% at 50% 0%, #1d1020 0%, var(--soot) 70%) fixed }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
svg { display: block }
.ico { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible }
.ico .f { fill: currentColor; stroke: none }
.num { font-variant-numeric: tabular-nums lining-nums }
.seal text { font-family: var(--disp); font-weight: 600; font-size: 46px; text-anchor: middle }
.seal .crack { display: none } .seal.cracked .crack { display: block }

/* ---------- a phone ---------- */
#app { max-width: 520px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--sc); font-size: 14px; letter-spacing: .08em; color: var(--tallow2); padding-bottom: 10px; border-bottom: 1px solid #2a1a2c; margin-bottom: 18px }
.top .me { display: flex; align-items: center; gap: 8px; color: var(--tallow); text-transform: none; letter-spacing: 0; font-family: var(--ui); font-size: 16px }
.top .me .seal { width: 28px; height: 28px }
.top .pot { color: var(--brass2) }
.eyebrow { font-family: var(--sc); font-size: 14px; letter-spacing: .16em; text-transform: lowercase; color: var(--brass2); margin: 0 0 4px }
h1, h2 { font-family: var(--book); font-weight: 400; margin: 0 0 10px; line-height: 1.12 }
h1 { font-size: 34px } h2 { font-size: 27px }
h1.disp { font-family: var(--disp); font-size: 44px; letter-spacing: .01em; color: var(--brass2) }
p { margin: 0 0 12px } .sub { color: var(--tallow2) } .small { font-size: 15px; color: var(--tallow2) }
.card { background: linear-gradient(180deg, #1a0f1c, #120b13); border: 1px solid #33203a; border-radius: 16px; padding: 18px; margin: 0 0 14px }
.card.hot { border-color: var(--brass); box-shadow: 0 0 0 1px rgba(174,98,73,.3), 0 10px 40px rgba(174,98,73,.12) }
.card.dir { border-style: dashed; border-color: #5b3a4f; background: #120a12 }
.card.dir > .eyebrow { color: var(--steel) }
.stack { display: flex; flex-direction: column; gap: 10px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 12px 18px; border-radius: 14px; border: 1px solid transparent; background: linear-gradient(180deg, #c2735a, var(--brass)); color: #1a0a0c; font-weight: 700; font-size: 18px; text-align: center; width: 100%; transition: transform .08s, filter .2s }
.btn:active { transform: scale(.98) } .btn:disabled { opacity: .45; cursor: default }
.btn.ghost { background: transparent; color: var(--tallow); border-color: #4a3150 }
.btn.dark { background: #1f1321; color: var(--tallow); border-color: #3b2640 }
.btn.big { min-height: 72px; font-size: 22px }
.btn.on { background: linear-gradient(180deg, #e6a58c, #c2735a); color: #1a0a0c; border-color: #f4c9b7 }
.btn.blood { background: linear-gradient(180deg, #d63a70, var(--ox)); color: #fff }
.btn.verd { background: linear-gradient(180deg, #6fbca1, var(--verd2)); color: #04120d }
.btn.sm { min-height: 42px; font-size: 15px; padding: 8px 12px; border-radius: 11px; width: auto }
.btn .ico { width: 22px; height: 22px }
input.f, textarea.f, select.f { width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 14px; border: 1px solid #4a3150; background: #0f0910; color: var(--tallow); font-size: 20px }
textarea.f { min-height: 150px; resize: vertical; font-size: 18px }
input.f:focus, textarea.f:focus, select.f:focus { outline: 2px solid var(--brass2); outline-offset: 1px }
input.code { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-size: 28px; font-weight: 700 }
label.l { display: block; font-family: var(--sc); font-size: 14px; letter-spacing: .08em; color: var(--tallow2); margin: 0 0 6px }
.msg { min-height: 22px; font-size: 15px; color: var(--tallow2); margin-top: 8px } .msg.err { color: var(--blood2) }
.people { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none }
.people li { display: flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 99px; background: #1b111d; border: 1px solid #2f1f33; font-size: 16px }
.people li .seal { width: 28px; height: 28px } .people li.dead { opacity: .45; text-decoration: line-through }
.people li.ok { border-color: var(--verd2) } .people li b { font-weight: 600 }
.people li button.x { border: 0; background: none; color: var(--mist); font-size: 18px; padding: 0 2px; min-width: 28px; min-height: 28px }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.pick button { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 12px; border-radius: 14px; border: 1px solid #3b2640; background: #170e19; text-align: left; font-size: 17px }
.pick button .seal { width: 34px; height: 34px; flex: none }
.pick button.on { border-color: var(--brass2); background: #2b1520; box-shadow: inset 0 0 0 1px var(--brass2) }
.pick button:disabled { opacity: .4 }
.clock { font-family: var(--book); font-size: 22px; color: var(--brass2); font-variant-numeric: tabular-nums }
.clock.low { color: var(--blood2) }
.bar { height: 6px; border-radius: 3px; background: #2a1a2c; overflow: hidden; margin: 6px 0 14px } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--brass2)); transition: width .25s linear }
.q { font-family: var(--book); font-size: 26px; line-height: 1.2; margin: 6px 0 16px }
.ans { font-family: var(--book); font-size: 30px; color: var(--brass2) }
.done { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: #122019; border: 1px solid var(--verd2); color: #cfe9de }
.done .ico { width: 26px; height: 26px; color: var(--verd) }
.letters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px }
.letters span { display: grid; place-items: center; aspect-ratio: 1; border-radius: 9px; background: #efe0d4; color: #241018; font-family: var(--book); font-size: 26px }
.words { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.words span { padding: 10px 4px; text-align: center; border-radius: 10px; background: #1b111d; border: 1px solid #33203a; font-size: 17px }
.cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.cells button, .cells span { display: grid; place-items: center; aspect-ratio: 1; border-radius: 12px; background: #1b111d; border: 1px solid #3b2640; color: var(--brass2) }
.cells .ico { width: 58%; height: 58% } .cells .hit { border-color: var(--verd); background: #10261e; color: #bfeadb } .cells .mine { box-shadow: inset 0 0 0 2px var(--brass2) }
.cells.blank span { background: #120b13; color: transparent }
.snapsym { display: grid; place-items: center; height: 42vh; max-height: 300px; color: var(--brass2) } .snapsym .ico { width: 70%; height: 70% }
.role { text-align: center; padding: 28px 18px }
.role .sigil { width: 150px; height: 150px; margin: 0 auto 14px }
.role.f h1 { color: var(--blood2) } .role.l h1 { color: #bfe0d3 }
.veil { display: grid; place-items: center; min-height: 300px; border-radius: 18px; border: 1px dashed #5b3a4f; background: repeating-linear-gradient(135deg, #140b15 0 14px, #170d18 14px 28px); text-align: center; padding: 20px }
.score { list-style: none; margin: 0; padding: 0; counter-reset: s }
.score li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #25172a }
.score li .seal { width: 30px; height: 30px } .score li .n { margin-left: auto; font-weight: 700; color: var(--brass2) } .score li.me { color: var(--brass2) }
.banner { padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 16px; background: #1d1a10; border: 1px solid #5a4a22; color: #ecdcae }
.banner.ghost { background: #121620; border-color: #33415a; color: #c4d2e4 }
.banner.sanct { background: #0f2019; border-color: var(--verd2); color: #cfe9de }
.foot { margin-top: auto; padding-top: 16px }
.ihead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px } .ihead .eyebrow { margin: 0 }
.row { display: flex; gap: 10px; align-items: center } .row > * { flex: 1 }
.center { text-align: center }
details.more { margin-top: 10px } details.more summary { cursor: pointer; color: var(--tallow2); font-size: 15px; padding: 8px 0 }
.live { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 99px; background: #2a1316; border: 1px solid #6a2733; color: #f3b7c4; font-size: 14px; z-index: 5 }
.brand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 18px 0 22px; text-align: center }
.brand svg { width: 64px; height: 76px; color: var(--brass2) }
.brand .t { font-family: var(--disp); font-size: 40px; color: var(--brass2); line-height: 1 }
.brand .m { font-family: var(--sc); font-size: 14px; letter-spacing: .3em; color: var(--tallow2) }
.fade { animation: fade .35s ease both } @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none } .bar i { transition: none } }

/* ---------- the TV ---------- */
body.tv { overflow: hidden; background: radial-gradient(90vw 70vh at 50% 110%, rgba(217,106,76,.18), transparent 62%), radial-gradient(120vw 80vh at 50% 0%, #1d1020, var(--soot) 70%) }
body.tv.night { background: #030204 }
#tvapp { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 4vh 5vw; font-size: 2.6vh }
.tvtop { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sc); letter-spacing: .12em; color: var(--tallow2); font-size: 2.4vh }
.tvtop .pot { color: var(--brass2); font-size: 3.2vh }
.tvmain { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.4vh; min-height: 0 }
.tvmain h1 { font-size: 8vh; margin: 0 } .tvmain h1.disp { font-size: 11vh }
.tvmain h2 { font-size: 5.4vh; max-width: 80vw; margin: 0 }
.tvmain .sub { font-size: 3vh; max-width: 70vw }
.tvmain .eyebrow { font-size: 2.6vh }
.tvmain .ans { font-size: 7vh }
.tvmain .clock { font-size: 5vh }
.tvcode { display: flex; gap: 5vw; align-items: center; justify-content: center }
.tvcode .c { font-family: var(--book); font-size: 13vh; letter-spacing: .12em; color: var(--brass2); line-height: 1 }
.tvcode .u { font-size: 3.4vh; color: var(--tallow2) } .tvcode .u b { color: var(--tallow); font-weight: 600 }
.tvpeople { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.4vh 1.4vw; max-width: 88vw }
.tvpeople .p { display: flex; flex-direction: column; align-items: center; gap: .6vh; width: 9vw; font-size: 2.2vh }
.tvpeople .p .seal { width: 7vh; height: 7vh } .tvpeople .p.dead { opacity: .35 } .tvpeople .p.ok .seal { filter: drop-shadow(0 0 1.2vh rgba(95,168,143,.8)) }
.tvpeople .p span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tvpeople .p em { font-style: normal; font-family: var(--sc); font-size: 1.7vh; letter-spacing: .08em; color: var(--blood2) } .tvpeople .p em.l { color: #9ed3c0 }
.tvscore { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .6vh 4vw; min-width: 50vw; font-size: 3vh; text-align: left }
.tvscore li { display: flex; gap: 1vw; align-items: center } .tvscore .seal { width: 4.5vh; height: 4.5vh } .tvscore b { margin-left: auto; color: var(--brass2) }
.tvgrid { display: grid; grid-template-columns: repeat(6, 11vh); gap: 1.4vh } .tvgrid span { display: grid; place-items: center; aspect-ratio: 1; border-radius: 1.4vh; background: #1b111d; border: 1px solid #3b2640; color: var(--brass2) } .tvgrid .ico { width: 60%; height: 60% } .tvgrid .hit { border-color: var(--verd); background: #10261e }
.tvletters { display: flex; gap: 1vh } .tvletters span { display: grid; place-items: center; width: 9vh; height: 9vh; border-radius: 1vh; background: #efe0d4; color: #241018; font-family: var(--book); font-size: 6vh }
.tvwords { display: grid; grid-template-columns: repeat(4, auto); gap: 1.2vh 4vw; font-family: var(--book); font-size: 5vh }
.tvsnap .ico { width: 40vh; height: 40vh; color: var(--brass2) }
.tvcount { font-family: var(--sc); letter-spacing: .1em; color: var(--tallow2); font-size: 2.8vh }
.tvlog { position: fixed; right: 2vw; bottom: 2vh; font-size: 1.8vh; color: var(--mist) }
</style>

<div id="app"></div>

/* ===================== The Betrayal — Modern: every phone, the director, and the optional TV =====================
   The server runs the game (worker/src/modern.js). This page joins, polls what this phone may see, and sends taps.

   /m/CODE               a player's phone (#create: the host sets up the game from the home page)

const P = (id) => (V && V.players.find((p) => p.id === id)) || { name: "?", color: "#ae6249" };
const N = (id) => esc(P(id).name);
const seal = (id) => ART.seal(P(id));

const ico = (n) => ART.icon(n);
const plural = (n, w, ws) => n + " " + (n === 1 ? w : ws || w + "s");
const clock = (end, from) => `<span class="clock" data-end="${end}"></span>` + (from ? `<div class="bar"><i data-from="${from}" data-end="${end}"></i></div>` : "");

const KILL = () => (V.kill === "murder" ? "murdered" : "poisoned");

// ---------------------------------------------------------------------------------------------------------------
async function api(path, body) {
  const r = await fetch("/api/g/" + (CODE || body.code) + "/" + path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", ...(tok ? { "X-Tok": tok } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  const j = await r.json().catch(() => ({ error: "The server didn’t answer properly." }));
  return { ok: r.ok, status: r.status, j };

function take(j) {

  if (j.view) { V = j.view; off = V.now - Date.now(); }
  if (j.rejoin) rejoin = j.rejoin; else if (j.view) rejoin = [];
}
async function poll() {
  clearTimeout(pollT);
  if (screen === "play" || screen === "tv" || screen === "wait") {
    try {
      if (screen === "wait") {
        const r = await api("m/join", { req: store.get(REQKEY) });
        if (r.j.tok) { tok = r.j.tok; store.set(TOKKEY, tok); store.set(REQKEY, null); screen = "play"; }
        else if (r.j.gone) { store.set(REQKEY, null); screen = "join"; say(r.j.error, true); }
      } else {
        const r = await api("m?v=" + (V ? V.ver : "") + "&me=" + (V && V.me ? V.me.id : ""));
        if (r.j.none) { if (r.j.classic) return (location.href = "/t/" + CODE); V = null; screen = screen === "tv" ? "tv" : "nogame"; }
        else take(r.j);
      }
      online = true;
    } catch (e) { online = false; }

  }

  pollT = setTimeout(poll, fast ? 350 : document.hidden ? 4000 : 1200);
}
async function send(a) {
  if (busy) return; busy = true; document.body.classList.add("busy");
  try {
    const r = await api("m/act", a);
    if (r.j.lost) { tok = null; store.set(TOKKEY, null); screen = "join"; say("This phone lost its place. Type your name to ask the host to let you back in.", true); }
    else { take(r.j); if (r.j.error) say(r.j.error, true); }
  } catch (e) { say("Can’t reach the game. Check you’re online.", true); }
  busy = false; document.body.classList.remove("busy"); draw();
}
function say(t, err) { toast = t ? (err ? "!" : "") + t : ""; clearTimeout(toastT); if (t) toastT = setTimeout(() => { toast = ""; draw(); }, 5000); draw(); }

// ---------------------------------------------------------------------------------------------------------------
// drawing: the screen is rebuilt only when it changes, keeping whatever is being typed and where
function draw() {
  const root = app(); if (!root) return;
  const html = screen === "tv" ? tvScreen() : phone();
  if (html === last) return clocks();
  const keep = {}; root.querySelectorAll("input[id],textarea[id],select[id]").forEach((x) => (keep[x.id] = x.value));
  const focus = document.activeElement && document.activeElement.id, sel = focus && document.activeElement.selectionStart;
  root.innerHTML = html; last = html;
  // a new screen fades in; the same screen with a new count or clock doesn't
  const k = root.querySelector("[data-k]"), key = screen + (k ? k.dataset.k : "");
  if (k && key !== lastKey) k.classList.add("fade"); lastKey = key;
  for (const [id, v] of Object.entries(keep)) { const x = document.getElementById(id); if (x && v) x.value = v; }
  if (focus) { const x = document.getElementById(focus); if (x) { x.focus(); try { x.setSelectionRange(sel, sel); } catch (e) {} } }
  else { const a = root.querySelector("[autofocus]"); if (a && matchMedia("(pointer:fine)").matches) a.focus(); }
  document.body.classList.toggle("night", !!V && V.phase === "night");
  clocks();
}
function clocks() {
  const t = now();
  document.querySelectorAll("[data-end].clock").forEach((c) => { const s = Math.max(0, Math.ceil((+c.dataset.end - t) / 1000)); c.textContent = s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : s + "s"; c.classList.toggle("low", s <= 5); });
  document.querySelectorAll("i[data-from]").forEach((b) => { const a = +b.dataset.from, e = +b.dataset.end; b.style.width = Math.max(0, Math.min(100, (100 * (e - t)) / Math.max(1, e - a))) + "%"; });
}
setInterval(() => { const it = V && V.trial && V.trial.item; if (it && it.k === "snap" && it.stage === "open") draw(); else clocks(); }, 200);

// ---------------------------------------------------------------------------------------------------------------

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === "peek") { peek = true; return draw(); }
  if (a === "goplay") { location.href = "/m/" + CODE; return; }
  if (a === "gotv") { screen = "tv"; boot(); return; }
  if (a === "join") return doJoin();
  if (a === "create") return doCreate();
  if (a === "opt") return send({ a: "opts", opts: { [b.dataset.k]: v } });
  if (a === "letin" || a === "keepout") { rejoin = rejoin.filter((r) => r.id !== v); return send({ a, v }); }
  if (a === "ansf") { const x = document.getElementById(v); if (!x || !x.value.trim()) return say("Type an answer first.", true); const val = x.value.trim(); x.value = ""; return send({ a: "ans", v: val }); }
  if (a === "out") return send({ a, who: b.dataset.who });
  if (a === "ack") peek = false;
  if (a === "start" && !confirm("Start the game? Nobody else can join after this.")) return;
  if (a === "reckon" && !V.roundTrials && !V.final && !confirm("Call the Reckoning without a Trial this round?")) return;
  if (a === "again" && !confirm("Start a new game with the same players?")) return;
  if (a === "sleep") return send({ a: "sleep" });
  send(v != null ? { a, v } : { a });
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey) return; const t = e.target; if (!t.id) return;
  if (t.id === "name" || t.id === "code") { e.preventDefault(); return screen === "create" ? doCreate() : doJoin(); }
  if (t.tagName === "INPUT") { const b = document.querySelector(`[data-a="ansf"][data-v="${t.id}"]`); if (b) { e.preventDefault(); b.click(); } }
});
document.addEventListener("change", (e) => { const t = e.target; if (t.dataset && t.dataset.opt) send({ a: "opts", opts: { [t.dataset.opt]: t.value } }); if (t.id === "pickt" && t.value) send({ a: "trial", v: t.value }); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

async function doJoin() {
  const name = ($("#name") || {}).value || "", code = CODE || String(($("#code") || {}).value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 6) return say("Table codes are six letters and numbers.", true);
  if (!name.trim()) return say("Type your name.", true);
  if (!CODE) { try { sessionStorage.setItem("bt-name", name.trim()); } catch (e) {} location.href = "/m/" + code; return; }
  say("Joining…");
  try {
    const r = await api("m/join", { name });
    if (r.j.none) { if (r.j.classic) { location.href = "/t/" + CODE; return; } return say("This Table hasn’t been set up yet. The host opens it first.", true); }
    if (r.j.tok) { tok = r.j.tok; store.set(TOKKEY, tok); take(r.j); screen = "play"; toast = ""; draw(); return poll(); }
    if (r.j.req) { store.set(REQKEY, r.j.req); screen = "wait"; toast = ""; draw(); return poll(); }
    say(r.status === 404 ? "There’s no Table with that code." : r.j.error || "That didn’t work.", true);
  } catch (e) { say("Can’t reach the game. Check you’re online.", true); }
}
async function doCreate() {
  const name = ($("#name") || {}).value || ""; if (!name.trim()) return say("Type your name.", true);
  let pass = ""; try { pass = sessionStorage.getItem("bt-pass-" + CODE) || ""; } catch (e) {}
  say("Opening…");
  try {
    const r = await api("m/create", { name, pass });
    if (r.j.tok) { tok = r.j.tok; store.set(TOKKEY, tok); take(r.j); screen = "play"; toast = ""; history.replaceState(null, "", "/m/" + CODE); draw(); return poll(); }
    if (r.j.mode === "modern") { history.replaceState(null, "", "/m/" + CODE); screen = tok ? "play" : "join"; draw(); return tok ? poll() : say(r.j.error, true); }
    say(r.j.error || "That didn’t work.", true);
  } catch (e) { say("Can’t reach the server. Check you’re online.", true); }
}
function boot() {
  document.body.innerHTML = (screen === "tv" ? `<div id="tvapp"></div>` : `<div id="app"></div>`) + ART.defs();
  document.body.classList.toggle("tv", screen === "tv");
  if (screen === "join" && CODE) { try { const n = sessionStorage.getItem("bt-name"); if (n) { sessionStorage.removeItem("bt-name"); draw(); $("#name").value = n; return doJoin(); } } catch (e) {} }
  if (screen === "wait" || (CODE && store.get(REQKEY) && !tok)) screen = "wait";
  draw(); poll();
}
boot();
</script>
