# Staging: staging.thebetrayal.co.uk — its own Worker, rooms and passes. Deploy by hand: ./deploy.sh staging
name = "cloak-and-candle-staging"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
account_id = "52f36be1337501d7eb4752e3ca42fac7"

routes = [
  { pattern = "staging.thebetrayal.co.uk", custom_domain = true }
]

[vars]
PASS_HOURS = "48"        # a redeemed party pass keeps its room writable this long
KEEP_DAYS = "7"          # then the room is read-only for this many days, then deleted
SITE_PASSWORD = "candlelight" # pre-launch gate for the whole site; delete this line to open it to the public
STRIPE_PRICE_ID = ""     # the party pass's Stripe Price (price_…), printed by tools/stripe-setup.sh; empty = checkout closed
STRIPE_EGG_PRICE_ID = ""     # the broken seal’s 10%-off one-party Price; empty = the seal offers no discount
# Secrets (never in this file), each: npx wrangler secret put NAME -c <this file>
#   ADMIN_TOKEN, STRIPE_SECRET_KEY (sk_test_… on staging, sk_live_… on production), STRIPE_WEBHOOK_SECRET (whsec_…), MASTER_PASS

[assets]
directory = "./worker/public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true   # every request passes the Worker first, so the password gate covers static files too

[durable_objects]
bindings = [
  { name = "GAME", class_name = "GameState" },
  { name = "REGISTRY", class_name = "Registry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameState", "Registry"]
