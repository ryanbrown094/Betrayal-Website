# Staging: staging.thebetrayal.co.uk, with its own Worker, rooms and booking codes. Deploy by hand: ./deploy.sh staging
# The Worker is named cloak-and-candle-staging because its Durable Objects are bound to that name.
name = "cloak-and-candle-staging"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
account_id = "52f36be1337501d7eb4752e3ca42fac7"

routes = [
  { pattern = "staging.thebetrayal.co.uk", custom_domain = true }
]

[vars]
PASS_HOURS = "48"        # a redeemed booking code keeps its room writable this long
KEEP_DAYS = "7"          # then the room is read-only for this many days, then deleted
SITE_PASSWORD = "candlelight" # pre-launch gate for the whole site; delete this line to open it to the public
STRIPE_PRICE_ID = ""     # the one-party Table's Stripe Price (price_…), printed by tools/stripe-setup.sh; empty = checkout closed
STRIPE_EGG_PROMO = ""     # the broken seal’s promotion code (promo_…, 10% off one party); empty = the seal offers no discount
APPSTORE_ISSUER_ID = ""  # the iPhone app's in-app purchases (worker/src/appstore.js): App Store Connect → Users and Access → Integrations → In-App Purchase. Empty = purchases in the app wait (503)
APPSTORE_KEY_ID = ""     # that key's ID; the key itself (its .p8 file) is the APPSTORE_PRIVATE_KEY secret
# Secrets (never in this file), each: npx wrangler secret put NAME -c <this file>
#   ADMIN_TOKEN, STRIPE_SECRET_KEY (sk_test_… on staging, sk_live_… on production), STRIPE_WEBHOOK_SECRET (whsec_…), MASTER_PASS, APPSTORE_PRIVATE_KEY (the In-App Purchase key's .p8)

[assets]
directory = "./worker/public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true   # every request passes the Worker first, so the password gate covers static files too

[durable_objects]
bindings = [
  { name = "GAME", class_name = "GameState" },
  { name = "REGISTRY", class_name = "Registry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameState", "Registry"]
